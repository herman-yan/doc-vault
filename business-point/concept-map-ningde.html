.dp-section{font-size:10.5px;color:rgba(255,255,255,0.3);letter-spacing:1.1px;margin-bottom:9px;text-transform:uppercase}

.rel-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}

#title-bar{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}

#hint-bar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;font-size:10.5px;color:rgba(255,255,255,0.15);letter-spacing:0.8px}

// ========== 预处理 ==========
var nodeMap = {};
rawNodes.forEach(function(rn) { nodeMap[rn.id] = rn; });

var degree = {};
rawEdges.forEach(function(e) {
  degree[e.s] = (degree[e.s] || 0) + 1;
  degree[e.t] = (degree[e.t] || 0) + 1;
});

var nodes = rawNodes.map(function(rn) {
  var d = degree[rn.id] || 0;
  var catSize = { input: 11, external: 9, internal: 9, output: 8, practice: 8, arch: 7 };
  var r = (catSize[rn.cat] || 7) + Math.min(d * 0.8, 10);
  return { id: rn.id, label: rn.label, cat: rn.cat, desc: rn.desc, docs: rn.docs, r: Math.max(r, 6) };
});

var edges = rawEdges.map(function(re) {
  var s = nodeMap[re.s], t = nodeMap[re.t];
  if (s && t) return { source: re.s, target: re.t, label: re.label };
  return null;
}).filter(function(x) { return x !== null; });

// ========== 类型筛选 ==========
var allTypes = [];
var typeSet = new Set();
rawNodes.forEach(function(r) { typeSet.add(r.cat); });
typeSet.forEach(function(t) { allTypes.push(t); });

var activeFilters = new Set(allTypes);

function renderFilterBar() {
  var bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  allTypes.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeFilters.has(t) ? ' active' : '');
    btn.style.borderColor = activeFilters.has(t) ? catColor(t) : 'rgba(255,255,255,0.12)';
    btn.style.background = activeFilters.has(t) ? catColor(t) + '18' : 'transparent';
    btn.style.color = activeFilters.has(t) ? '#fff' : 'rgba(255,255,255,0.55)';
    btn.textContent = catLabel(t);
    btn.onclick = function() { toggleFilter(t); };
    bar.appendChild(btn);
  });
}

function toggleFilter(type) {
  if (activeFilters.has(type) && activeFilters.size > 1) activeFilters.delete(type);
  else if (!activeFilters.has(type)) activeFilters.add(type);
  renderFilterBar();
  updateVisibility();
}

function updateVisibility() {
  nodeSel.style('display', function(d) { return activeFilters.has(d.cat) ? null : 'none'; });
  linkSel.style('display', function(d) {
    var sId = typeof d.source === 'object' ? d.source.id : d.source;
    var tId = typeof d.target === 'object' ? d.target.id : d.target;
    var sNode = nodeMap[sId], tNode = nodeMap[tId];
    if (sNode && activeFilters.has(sNode.cat) && tNode && activeFilters.has(tNode.cat)) return null;
    return 'none';
  });
}

  if (e.target.tagName === 'svg' || e.target.classList.contains('main-group')) {
    closePanel();
    highlightNode(null);
  }
});

// 力模拟
function getCatFromEdge(endpoint) {
  if (typeof endpoint === 'object' && endpoint !== null) return endpoint.cat;
  var nd = nodeMap[endpoint];
  return nd ? nd.cat : null;
}

var simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges)
    .id(function(d) { return d.id; })
    .distance(function(d) {
      var sCat = getCatFromEdge(d.source);
      var tCat = getCatFromEdge(d.target);
      if (sCat && tCat && sCat !== tCat) return 130;
      return 88;
    })
    .strength(0.45)
  )
  .force('charge', d3.forceManyBody().strength(-260))
  .force('center', d3.forceCenter(W / 2, H / 2))
  .force('collide', d3.forceCollide().radius(function(d) { return d.r + 14; }));

// 连线
var linkSel = gLinks.selectAll('line')
  .data(edges).enter().append('line')
  .attr('stroke', '#d1cfc5')
  .attr('stroke-opacity', 0.38)
  .attr('stroke-width', 1)
  .attr('stroke-linecap', 'round');

// 边标签
var linkLabelSel = gLinks.selectAll('text.edge-label')
  .data(edges).enter().append('text')
  .attr('class', 'edge-label')
  .attr('font-size', '9px')
  .attr('fill', 'rgba(255,255,255,0.4)')
  .attr('text-anchor', 'middle')
  .attr('pointer-events', 'none')
  .text(function(d) { return d.label; })
  .style('opacity', 0);

// 节点组
var nodeSel = gNodes.selectAll('g')
  .data(nodes).enter().append('g')
  .attr('class', 'node-group')
  .style('cursor', 'pointer')
  .call(d3.drag()
    .on('start', dragStarted)
    .on('drag', dragged)
    .on('end', dragEnded)
  );

// 节点光圈（选中/关联高亮）
nodeSel.append('circle')
  .attr('class', 'glow')
  .attr('r', function(d) { return d.r + 6; })
  .attr('fill', 'none')
  .attr('stroke', function(d) { return catColor(d.cat); })
  .attr('stroke-width', 2)
  .attr('stroke-opacity', 0);

// 节点圆
nodeSel.append('circle')
  .attr('r', function(d) { return d.r; })
  .attr('fill', function(d) { return catColor(d.cat); })
  .attr('fill-opacity', 0.82)
  .attr('stroke', function(d) { return catColor(d.cat); })
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.3);

// 节点标签
nodeSel.append('text')
  .text(function(d) {
    var txt = d.label;
    return txt.length > 7 ? txt.slice(0, 6) + '…' : txt;
  })
  .attr('dy', function(d) { return d.r + 14; })
  .attr('text-anchor', 'middle')
  .style('font-size', '10.5px')
  .style('fill', 'rgba(255,255,255,0.6)')
  .style('pointer-events', 'none')
  .style('font-weight', function(d) { return (degree[d.id] || 0) >= 8 ? '600' : '400'; });

    if (!selectedNode) highlightNode(d.id);

  .on('mousemove', function(e) {
    var tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 16) + 'px';
    tt.style.top = (e.clientY - 8) + 'px';
  })
  .on('mouseout', function() {
    hoveredNode = null;
    document.getElementById('tooltip').style.display = 'none';
    if (!selectedNode) highlightNode(null);
  });

// 点击
nodeSel.on('click', function(e, d) {
  e.stopPropagation();
  selectedNode = d;
  showDetail(d);
  highlightNode(d.id);
  zoomToNode(d);
});

function highlightNode(nodeId) {
  if (!nodeId) {
    nodeSel.style('opacity', 1);
    linkSel.attr('stroke', '#d1cfc5').attr('stroke-opacity', 0.38).attr('stroke-width', 1);
    linkLabelSel.style('opacity', 0);
    nodeSel.select('.glow').attr('stroke-opacity', 0);
    return;
  }
  var connected = new Set([nodeId]);
  edges.forEach(function(l) {
    var sId = typeof l.source === 'object' ? l.source.id : l.source;
    var tId = typeof l.target === 'object' ? l.target.id : l.target;
    if (sId === nodeId) connected.add(tId);
    if (tId === nodeId) connected.add(sId);
  });
  nodeSel.style('opacity', function(d) { return connected.has(d.id) ? 1 : 0.1; });
  var hlColor = catColor((nodeMap[nodeId] || {}).cat || 'practice');
  linkSel
    .attr('stroke', function(l) {
      var sId = typeof l.source === 'object' ? l.source.id : l.source;
      var tId = typeof l.target === 'object' ? l.target.id : l.target;
      return (sId === nodeId || tId === nodeId) ? hlColor : '#d1cfc5';
    })
    .attr('stroke-opacity', function(l) {
      var sId = typeof l.source === 'object' ? l.source.id : l.source;
      var tId = typeof l.target === 'object' ? l.target.id : l.target;
      return (sId === nodeId || tId === nodeId) ? 0.85 : 0.06;
    })
    .attr('stroke-width', function(l) {
      var sId = typeof l.source === 'object' ? l.source.id : l.source;
      var tId = typeof l.target === 'object' ? l.target.id : l.target;
      return (sId === nodeId || tId === nodeId) ? 2.2 : 0.6;
    });
  linkLabelSel.style('opacity', function(l) {
    var sId = typeof l.source === 'object' ? l.source.id : l.source;
    var tId = typeof l.target === 'object' ? l.target.id : l.target;
    return (sId === nodeId || tId === nodeId) ? 1 : 0;
  });
  nodeSel.select('.glow').attr('stroke-opacity', 0);
  nodeSel.filter(function(d) { return d.id === nodeId; })
    .select('.glow')
    .attr('stroke-opacity', 0.7);
}

function zoomToNode(d) {
  var x = d.x || W / 2, y = d.y || H / 2;
  var scale = 1.6;
  var tx = W / 2 - x * scale, ty = H / 2 - y * scale;
  svg.transition().duration(550).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
}

// 详情面板
function showDetail(d) {
  var panel = document.getElementById('detail-panel');
  panel.classList.add('open');
  document.getElementById('dp-title').innerHTML =
    '<span id="dp-type-dot" style="background:' + catColor(d.cat) + '"></span>' + d.label;
  document.getElementById('dp-cat').textContent = catLabel(d.cat);
  document.getElementById('dp-desc').textContent = d.desc || '';
  var docsDiv = document.getElementById('dp-docs');
  docsDiv.innerHTML = '';
  (d.docs || []).forEach(function(doc) {
    var el = document.createElement('div');
    el.className = 'dp-doc';
    el.textContent = '\uD83D\uDCC4 ' + doc;
    docsDiv.appendChild(el);
  });
  var relDiv = document.getElementById('dp-relations');
  relDiv.innerHTML = '';
  var rels = [];
  edges.forEach(function(l) {
    var sId = typeof l.source === 'object' ? l.source.id : l.source;
    var tId = typeof l.target === 'object' ? l.target.id : l.target;
    if (sId === d.id) rels.push({ id: tId, label: l.label });
    if (tId === d.id) rels.push({ id: sId, label: l.label });
  });
  rels.forEach(function(rel) {
    var other = nodeMap[rel.id];
    if (!other) return;
    var item = document.createElement('div');
    item.className = 'dp-rel-item';
    item.innerHTML = '<span class="rel-dot" style="background:' + catColor(other.cat) + '"></span><div class="rel-info"><span class="rel-name">' + other.label + '</span><span class="rel-label">' + rel.label + '</span></div>';
    item.onclick = (function(rel) {
      return function(e) {
        e.stopPropagation();
        var target = nodes.find(function(n) { return n.id === rel.id; });
        if (target) {
          selectedNode = target;
          showDetail(target);
          highlightNode(target.id);
          zoomToNode(target);
        }
      };
    })(rel);
    relDiv.appendChild(item);
  });
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedNode = null;
  highlightNode(null);
}

// ========== 搜索 ==========
var searchQuery = '';
window.onSearch = function(val) {
  searchQuery = val.trim();
  var cl = document.getElementById('search-clear');
  cl.style.display = searchQuery ? 'inline' : 'none';
  if (!searchQuery) {
    nodeSel.style('opacity', 1);
    linkSel.attr('stroke-opacity', 0.38);
    linkLabelSel.style('opacity', 0);
    document.getElementById('search-count').textContent = '';
    return;
  }
  var q = searchQuery.toLowerCase();
  var matchCount = 0;
  nodeSel
    .style('opacity', function(d) {
      var match = d.id.toLowerCase().indexOf(q) >= 0 || d.label.toLowerCase().indexOf(q) >= 0 || (d.desc || '').toLowerCase().indexOf(q) >= 0;
      if (match) matchCount++;
      return match ? 1 : 0.06;
    });
  linkSel.attr('stroke-opacity', function(d) {
    var sId = typeof d.source === 'object' ? d.source.id : d.source;
    var tId = typeof d.target === 'object' ? d.target.id : d.target;
    var sMatch = sId.toLowerCase().indexOf(q) >= 0 || (nodeMap[sId] && nodeMap[sId].label.toLowerCase().indexOf(q) >= 0);
    var tMatch = tId.toLowerCase().indexOf(q) >= 0 || (nodeMap[tId] && nodeMap[tId].label.toLowerCase().indexOf(q) >= 0);
    return (sMatch && tMatch) ? 0.5 : 0.04;
  });
  document.getElementById('search-count').textContent = matchCount + '/' + nodes.length;
  var firstMatch = nodes.find(function(n) {
    return n.id.toLowerCase().indexOf(q) >= 0 || n.label.toLowerCase().indexOf(q) >= 0;
  });
  if (firstMatch && firstMatch.x !== undefined) zoomToNode(firstMatch);
};

window.clearSearch = function() {
  document.getElementById('search-input').value = '';
  onSearch('');
};

// ========== 拖拽 ==========
function dragStarted(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) {
  d.fx = e.x; d.fy = e.y;
}
function dragEnded(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ========== Tick ==========
simulation.on('tick', function() {
  linkSel
    .attr('x1', function(d) { return d.source.x; })
    .attr('y1', function(d) { return d.source.y; })
    .attr('x2', function(d) { return d.target.x; })
    .attr('y2', function(d) { return d.target.y; });
  linkLabelSel
    .attr('x', function(d) { return (d.source.x + d.target.x) / 2; })
    .attr('y', function(d) { return (d.source.y + d.target.y) / 2 - 4; });
  nodeSel.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
});

// ========== Resize ==========
var ro = new ResizeObserver(function() {
  W = window.innerWidth; H = window.innerHeight;
  d3.select('#graph-svg').attr('width', W).attr('height', H);
  simulation.force('center', d3.forceCenter(W / 2, H / 2));
  simulation.alpha(0.05).restart();
});
ro.observe(document.body);

// ========== 初始化 ==========
renderFilterBar();

console.log('\uD83C\uDFAF 概念地图已就绪 — D3.js 力导向图引擎');
</script>
</body>
</html>
