// 某企业关联的项目名（用于联系人关联项目下拉）
function partnerProjectNames(name) {
  if (!appData) return [];
  const set = [];
  const add = n => { if (n && set.indexOf(n) === -1) set.push(n); };
  appData.businessPartners.forEach(p => { if (p.name === name) add(p.relatedProject || p.name); });
  appData.venuePartners.forEach(p => { if (p.name === name) add('场地合作'); });
  appData.industryPartners.forEach(p => {
    if (p.company === name) {
      const t = (p.direction || '') + (p.status || '');
      if (/展厅|检测|延保|销售|售前/.test(t)) add('场地合作');
    }
  });
  appData.projects.forEach(p => { if (p.name === name) add(p.name); });
  if (set.length === 0) appData.projects.forEach(p => add(p.name));
  return set;
}

function openContactModalFor(partnerName, projectName) {
  const p = getAllPartners().find(x => x.name === partnerName);
  openContactModal();
  if (!p) return;
  selectContactPartner(p.name, p.section);
  if (!projectName) return;
  const rows = document.querySelectorAll('#contactList .contact-item');
  let target = null;
  if (rows.length) {
    const last = rows[rows.length - 1];
    const filled = [...last.querySelectorAll('input')].map(i => (i.value || '').trim()).join('');
    if (!filled) target = last;
  }
  if (!target) { addContactRow('', '', '', projectName); return; }
  const sel = target.querySelector('select');
  if (!sel) return;
  if (![...sel.options].some(o => o.value === projectName)) {
    sel.add(new Option(projectName, projectName, true, true));
  } else {
    sel.value = projectName;
  }
}

function renderDatabaseView() {
  // ========== 0. 跟进人固定色（同名字永远同色） ==========
  const FOLLOWER_COLORS = [
    '#1d9bf0','#00ba7c','#ff7a00','#7856ff','#f4212e','#ffd400',
    '#00bcd4','#9c27b0','#4caf50','#ff5722','#607d8b','#e91e63'
  ];
  function followerColor(name) {
    if (!name) return 'var(--text-soft)';
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
    return FOLLOWER_COLORS[Math.abs(hash) % FOLLOWER_COLORS.length];
  }
  function followerBadge(name, size) {
    if (!name) return '<span class="db-follower-none">未分配</span>';
    const s = size || 20;
    const c = followerColor(name);
    const initial = name.charAt(0);
    return `<span class="db-follower-badge" style="background:${String(c).replace('#','rgba(')+',0.12)'};color:${c}">
      <span class="db-follower-avatar" style="background:${c}">${initial}</span>${name}</span>`;
  }

  // ========== 1. 构建统一客户数据 ==========
  const customerMap = {};
  const avatarColors = ['#1d9bf0','#00ba7c','#ff7a00','#7856ff','#f4212e','#ffd400'];
  
  function ensureCustomer(name) {
    if (!customerMap[name]) {
      customerMap[name] = { name, industry: '', contacts: [], projects: [], sources: new Set() };
    }
    return customerMap[name];
  }
  
  function findProjectByName(name) {
    return appData.projects.find(p => p.name === name);
  }
  
  function addProjectToCustomer(customerName, projectName, direction, status, issue, priority) {
    const c = ensureCustomer(customerName);
    // Avoid duplicate project links
    if (c.projects.find(p => p.projectName === projectName)) return;
    const proj = findProjectByName(projectName);
    c.projects.push({
      projectId: proj ? proj.id : null,
      projectName,
      direction: direction || '',
      status: status || '',
      issue: issue || '',
      priority: priority || (proj ? proj.priority : ''),
      latestEntry: proj && proj.timeline && proj.timeline.length > 0 ? proj.timeline[0] : null,
      latestUpdate: proj ? proj.latestUpdate : '',
      totalUpdates: proj ? proj.totalUpdates : 0,
      completion: proj ? proj.completion : '',
      timeline: proj ? (proj.timeline || []).slice(0, 5) : []
    });
  }
  
  // Merge businessPartners
  appData.businessPartners.forEach(p => {
    const c = ensureCustomer(p.name);
    c.sources.add('business');
    if (p.type && p.type.includes('政府')) c.industry = c.industry || '政府合作方';
    else if (p.type) c.industry = c.industry || p.type;
    if (p.contact && p.contact.length > 0) {
      p.contact.forEach(ct => {
        if (!c.contacts.find(x => x.name === ct.name && x.phone === ct.phone)) {
          c.contacts.push(ct);
        }
      });
    }
    // Link to related project
    const relatedName = p.relatedProject || p.name;
    const matchedProj = findProjectByName(relatedName) || findProjectByName(p.name);
    if (matchedProj) {
      addProjectToCustomer(p.name, matchedProj.name, p.direction, p.status, p.issue || '', matchedProj.priority);
    } else {
      // No matching project, still show as a standalone entry
      c.projects.push({
        projectId: null, projectName: relatedName || p.name,
        direction: p.direction || '', status: p.status || '',
        issue: p.issue || '', priority: '',
        latestEntry: null, latestUpdate: '', totalUpdates: 0, completion: '',
        timeline: []
      });
    }
  });
  
  // Merge venuePartners
  appData.venuePartners.forEach(p => {
    const c = ensureCustomer(p.name);
    c.sources.add('venue');
    c.industry = c.industry || '场地合作方';
    if (p.contact && p.contact.length > 0) {
      p.contact.forEach(ct => {
        if (!c.contacts.find(x => x.name === ct.name && x.phone === ct.phone)) c.contacts.push(ct);
      });
    }
    addProjectToCustomer(p.name, '场地合作', p.content.substring(0, 50), '合作洽谈中', '', '高');
  });
  
  // Merge industryPartners
  appData.industryPartners.forEach(p => {
    const c = ensureCustomer(p.company);
    c.sources.add('industry');
    c.industry = c.industry || p.industry || '待分类';
    if (p.contact && p.contact.length > 0) {
      p.contact.forEach(ct => {
        if (!c.contacts.find(x => x.name === ct.name && x.phone === ct.phone)) c.contacts.push(ct);
      });
    }
    // Try to match to a project by direction or status keywords
    let matchedProject = null;
    const text = (p.direction + ' ' + p.status).toLowerCase();
    if (text.includes('售前') || text.includes('展厅') || text.includes('检测') || text.includes('延保') || text.includes('销售')) {
      matchedProject = findProjectByName('场地合作');
    }
    if (matchedProject) {
      addProjectToCustomer(p.company, '场地合作', p.industry ? p.industry + ' · ' + (p.direction || '') : (p.direction || ''), p.status || '待跟进', p.issue || '', '高');
    } else {
      // Add as standalone
      c.projects.push({
        projectId: null, projectName: p.industry || p.direction || '合作接洽',
        direction: p.direction || '', status: p.status || '待跟进',
        issue: p.issue || '', priority: '',
        latestEntry: null, latestUpdate: '', totalUpdates: 0, completion: '',
        timeline: []
      });
    }
  });
  
  // ========== 2. 大分类（合作类型 / 行业） ==========
  const CAT_DEFS = [
    { key: '政府合作方', icon: '🏛', color: '#3a5a9c' },
    { key: '战略合作方', icon: '⭐', color: '#a3814a' },
    { key: '业务合作方', icon: '🤝', color: '#2f7a9b' },
    { key: '潜在客户',   icon: '🔍', color: '#5f6b7a' },
    { key: '场地合作方', icon: '📍', color: '#2c7a6b' },
    { key: '未分类',     icon: '📁', color: '#6b7280' }
  ];
  const IND_COLORS = ['#2f7a9b','#2c7a6b','#a3814a','#3a5a9c','#6b5a8c','#5f6b7a','#4a7a8c','#6b7a5a'];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function normalizeCategory(text) {
    const t = String(text || '');
    if (t.includes('政府')) return '政府合作方';
    if (t.includes('战略')) return '战略合作方';
    if (t.includes('业务')) return '业务合作方';
    if (t.includes('场地')) return '场地合作方';
    if (t.includes('潜在')) return '潜在客户';
    return '';
  }
  function hexToRgba(hex, a) {
    const h = String(hex).replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }
  function personColor(name) {
    let hash = 0;
    for (let i = 0; i < String(name).length; i++) hash = ((hash << 5) - hash + String(name).charCodeAt(i)) | 0;
    return IND_COLORS[Math.abs(hash) % IND_COLORS.length];
  }
  function phoneHref(p) { return 'tel:' + String(p || '').replace(/[^\d+\-]/g, ''); }

  // 联系人 chip（姓名 / 职位 / 电话 + 复制）
  function contactChip(ct, opts) {
    const o = opts || {};
    const nm = esc(ct.name || '未命名');
    const ph = ct.phone ? String(ct.phone).trim() : '';
    const role = ct.role ? String(ct.role).trim() : '';
    const color = personColor(ct.name || '?');
    return `<span class="contact-chip">
      <span class="contact-avatar" style="background:${color}">${esc((ct.name || '?').charAt(0))}</span>
      <span class="contact-name">${nm}</span>
      ${role ? `<span class="contact-role">${esc(role)}</span>` : ''}
      ${ph ? `<a class="contact-phone" href="${phoneHref(ph)}" title="拨打 ${esc(ph)}">📞 ${esc(ph)}</a>
              <button class="icon-btn" title="复制号码" onclick="event.stopPropagation();copyText('${esc(ph)}',this)">⧉</button>` : ''}
      ${o.owner ? `<span class="mini-tag">${esc(o.owner)}</span>` : ''}
    </span>`;
  }

  // 归类：类别 + 行业标签
  Object.values(customerMap).forEach(c => {
    let cat = normalizeCategory(c.industry);
    if (c.sources.has('venue')) cat = '场地合作方';
    if (!cat && c.sources.has('industry') && !c.sources.has('business')) cat = '潜在客户';
    c.category = cat || '未分类';

    let ind = '';
    if (c.sources.has('industry')) {
      const ip = appData.industryPartners.find(p => p.company === c.name);
      if (ip && ip.industry && !normalizeCategory(ip.industry)) ind = ip.industry;
    }
    if (!ind && !normalizeCategory(c.industry) && c.industry && c.industry !== '待分类') ind = c.industry;
    c.industryTag = ind;
  });

  const allCustomers = Object.values(customerMap);

  // 按当前模式分组
  const catList = [];
  function getCatDef(key) {
    let def = CAT_DEFS.find(d => d.key === key);
    if (!def) {
      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
      def = { key, icon: '🏷', color: IND_COLORS[Math.abs(hash) % IND_COLORS.length] };
    }
    return def;
  }
  function buildGroups() {
    const map = {};
    allCustomers.forEach(c => {
      const key = groupMode === 'industry' ? (c.industryTag || '待补充行业') : c.category;
      if (!map[key]) map[key] = [];
      map[key].push(c);
    });
    const order = groupMode === 'industry' ? null : CAT_DEFS.map(d => d.key);
    const keys = order ? order.filter(k => map[k]) : Object.keys(map).sort((a, b) => map[b].length - map[a].length);
    return keys.map(k => {
      const def = getCatDef(k);
      const members = map[k].slice().sort((a, b) => {
        if (b.projects.length !== a.projects.length) return b.projects.length - a.projects.length;
        return a.name.localeCompare(b.name, 'zh');
      });
      const projCount = members.reduce((s, c) => s + c.projects.length, 0);
      const riskCount = members.reduce((s, c) => s + c.projects.filter(p => p.issue).length, 0);
      const peopleCount = members.reduce((s, c) => s + c.contacts.length, 0);
      return { key: k, icon: def.icon, color: def.color, members, projCount, riskCount, peopleCount };
    });
  }

  const groups = buildGroups();

  // ========== 3. 渲染 ==========
  let html = '';

  // 3.1 顶部分类概览
  html += `<div class="cat-overview">`;
  groups.forEach(g => {
    const bg = hexToRgba(g.color, 0.15);
    const active = activeCatFilter === g.key ? ' active' : '';
    html += `
      <div class="cat-chip${active}" style="--cat-color:${g.color};--cat-bg:${bg}" onclick="toggleCatFilter('${esc(g.key)}')">
        <div class="cat-chip-top">
          <span class="cat-chip-ico">${g.icon}</span>
          <span class="cat-chip-name">${esc(g.key)}</span>
        </div>
        <div class="cat-chip-nums">
          <span><b>${g.members.length}</b> 客户</span>
          <span><b>${g.projCount}</b> 项目</span>
          ${g.riskCount ? `<span style="color:var(--orange)"><b>${g.riskCount}</b> 风险</span>` : ''}
        </div>
      </div>`;
  });
  html += `</div>`;

  if (groups.length === 0) {
    html += `<div class="crm-empty">暂无客户数据</div>`;
  }

  // 3.2 分类区块
  groups.forEach(g => {
    if (activeCatFilter && activeCatFilter !== g.key) return;
    const bg = hexToRgba(g.color, 0.15);
    html += `
      <div class="cat-section" data-cat="${esc(g.key)}" style="--cat-color:${g.color};--cat-bg:${bg}">
        <div class="cat-head" onclick="toggleCatSection(this)">
          <span class="cat-head-ico">${g.icon}</span>
          <div class="cat-head-main">
            <div class="cat-head-title">${esc(g.key)}</div>
            <div class="cat-head-stats">
              <span>客户 ${g.members.length}</span>
              <span>项目 ${g.projCount}</span>
              <span>对接人 ${g.peopleCount}</span>
              ${g.riskCount ? `<span class="warn">待解决 ${g.riskCount}</span>` : ''}
            </div>
          </div>
          <span class="cat-head-arrow">▼</span>
        </div>
        <div class="cat-body">
          ${g.members.map(c => renderCustomerCard(c, g.color)).join('')}
        </div>
      </div>`;
  });

  function renderCustomerCard(c, catColor) {
    const projCount = c.projects.length;
    const riskCount = c.projects.filter(p => p.issue).length;
    const custContacts = c.contacts;
    const latestCustUpdate = c.projects.reduce((m, p) => (p.latestUpdate && p.latestUpdate > m ? p.latestUpdate : m), '') || '';

    // 客户级对接人条
    const headContacts = custContacts.slice(0, 4);
    const restCount = custContacts.length - headContacts.length;
    let contactBar = '';
    if (custContacts.length > 0) {
      contactBar = `<div class="contact-bar">
        ${headContacts.map(ct => contactChip(ct, {})).join('')}
        ${restCount > 0 ? `<span class="mini-tag">+${restCount}</span>` : ''}
        <button class="contact-add" onclick="event.stopPropagation();openContactModalFor('${esc(c.name)}','')">编辑对接人</button>
      </div>`;
    } else {
      contactBar = `<div class="contact-bar">
        <button class="contact-add" onclick="event.stopPropagation();openContactModalFor('${esc(c.name)}','')">＋ 添加对接人</button>
      </div>`;
    }

    // 项目卡
    const projHtml = c.projects.map(p => {
      const own = c.contacts.filter(ct => ct.project && ct.project === p.projectName);
      const list = own.length ? own : c.contacts.filter(ct => !ct.project);
      const ownerLabel = own.length ? '本项目' : (list.length ? '客户共用' : '');
      const pctRaw = parseFloat(p.completion);
      const hasPct = !isNaN(pctRaw) && p.completion !== '' && p.completion != null;
      const pct = hasPct ? Math.min(100, Math.max(0, pctRaw <= 1 ? pctRaw * 100 : pctRaw)) : 0;
      const latest = p.latestEntry ? p.latestEntry.content.split('\n')[0] : '';
      const prioClass = p.priority === '战败' ? 'lost' : (p.priority === '低' ? 'low' : '');
      const tl = (p.timeline || []).slice(1, 6);

      return `
        <div class="proj-card">
          <div class="proj-head">
            <span class="proj-name" ${p.projectId ? `onclick="event.stopPropagation();showDetail(${p.projectId})"` : ''}>${esc(p.projectName)}</span>
            ${p.status ? `<span class="proj-status">${esc(p.status)}</span>` : ''}
            ${p.priority ? `<span class="proj-prio ${prioClass}">${esc(p.priority)}</span>` : ''}
            <span class="proj-date">${p.latestUpdate ? esc(String(p.latestUpdate).substring(5).replace('-', '/')) : ''}${p.totalUpdates ? ` · ${p.totalUpdates}次` : ''}</span>
          </div>
          <div class="proj-body">
            ${p.direction ? `<div class="proj-dir">方向：${esc(p.direction)}</div>` : ''}
            ${hasPct ? `<div class="proj-bar"><i style="width:${pct}%"></i></div><div class="proj-bar-txt">完成度 ${Math.round(pct)}%</div>` : ''}
            ${latest ? `<div class="proj-latest">最近：${esc(latest)}</div>` : ''}
            ${p.issue ? `<div class="proj-issue">风险：${esc(p.issue)}</div>` : ''}
          </div>
          <div class="proj-contacts">
            <div class="proj-contacts-head">
              <span class="proj-contacts-label">${ownerLabel ? `对接人（${ownerLabel}）` : '对接人'}</span>
              <button class="contact-add" style="font-size:10.5px;padding:2px 7px" onclick="event.stopPropagation();openContactModalFor('${esc(c.name)}','${esc(p.projectName)}')">编辑</button>
            </div>
            <div class="proj-contacts-list">
              ${list.length
                ? list.map(ct => contactChip(ct, {})).join('')
                : `<span class="proj-empty-contacts">暂无对接人</span>`}
            </div>
          </div>
          ${tl.length ? `
            <div class="proj-timeline" id="ptl-${p.projectId || 'x'}-${Math.random().toString(36).slice(2, 7)}">
              ${tl.map(e => `<div class="proj-timeline-item"><b>${esc((e.date || '').substring(5).replace('-', '/'))}</b>${esc((e.content || '').split('\n')[0])}</div>`).join('')}
            </div>
            <button class="proj-timeline-toggle" onclick="event.stopPropagation();toggleProjTimeline(this)">查看历史进展（${tl.length}）</button>
          ` : ''}
        </div>`;
    }).join('');

    const searchBlob = (c.name + ' ' + c.category + ' ' + c.industryTag + ' ' +
      c.projects.map(p => p.projectName + ' ' + (p.direction || '') + ' ' + (p.status || '')).join(' ') + ' ' +
      c.contacts.map(x => (x.name || '') + ' ' + (x.phone || '') + ' ' + (x.role || '')).join(' ')).toLowerCase();

    return `
      <div class="cust-card" data-name="${esc(c.name)}" data-search="${esc(searchBlob)}" style="--cat-color:${catColor}">
        <div class="cust-head" onclick="toggleCustomerCard(this)">
          <div class="cust-avatar" style="background:${catColor}">${esc(c.name.charAt(0))}</div>
          <div class="cust-main">
            <div class="cust-line1">
              <span class="cust-name">${esc(c.name)}</span>
              ${c.industryTag ? `<span class="mini-tag ind">${esc(c.industryTag)}</span>` : ''}
              <span class="mini-tag">${esc(c.category)}</span>
              ${riskCount ? `<span class="mini-tag warn">⚠ ${riskCount}</span>` : ''}
            </div>
            <div class="cust-line2">
              <span>对接人 ${custContacts.length || '—'}</span>
              ${latestCustUpdate ? `<span>最近更新 ${esc(latestCustUpdate.substring(5).replace('-', '/'))}</span>` : ''}
            </div>
          </div>
          <div class="cust-actions">
            <span class="cust-arrow">▼</span>
          </div>
        </div>
        <div class="cust-body">
          ${contactBar}
          <div class="proj-grid proj-n${Math.min(c.projects.length, 4)}">${projHtml}</div>
        </div>
      </div>`;
  }

  document.getElementById('customerTables').innerHTML = html;
}

function toggleCustomerCard(headerEl) {
  const card = headerEl.closest('.cust-card') || headerEl.closest('.customer-card');
  if (card) card.classList.toggle('collapsed');
}

// Search / filter
function filterTable(query) {
  const q = query.toLowerCase().trim();
  const cards = document.querySelectorAll('.cust-card');
  cards.forEach(card => {
    const searchText = card.getAttribute('data-search') || '';
    card.style.display = (!q || searchText.includes(q)) ? '' : 'none';
  });
  // 隐藏无命中客户的分类区块
  document.querySelectorAll('.cat-section').forEach(sec => {
    const visible = sec.querySelectorAll('.cust-card:not([style*="display: none"])').length;
    sec.style.display = visible ? '' : 'none';
  });
}

// ===================== 最新动态快捷编辑 =====================
function toggleLatestQuickEdit(projectId, event) {
  event.stopPropagation();
  // 找到所有匹配的快捷编辑面板（可能有多个相同projectId的）
  const allPanels = document.querySelectorAll(`[id^="latestQuickEdit-${projectId}-"]`);
  const wasOpen = allPanels.length > 0 && allPanels[0].classList.contains('open');
  
  // 关闭所有面板
  document.querySelectorAll('.latest-quick-edit.open').forEach(p => p.classList.remove('open'));
  
  if (!wasOpen) {
    // 展开该项目的第一个面板
    allPanels.forEach(p => p.classList.add('open'));
    setTimeout(() => {
      const contentInput = allPanels[0]?.querySelector('.lq-content');
      if (contentInput) contentInput.focus();
    }, 100);
  }
}

function closeLatestQuickEdit(projectId, idx, event) {
  if (event) event.stopPropagation();
  const panel = document.getElementById(`latestQuickEdit-${projectId}-${idx}`);
  if (panel) panel.classList.remove('open');
}

async function submitLatestQuickEdit(projectId, idx, event) {
  if (event) event.stopPropagation();
  const panel = document.getElementById(`latestQuickEdit-${projectId}-${idx}`);
  if (!panel) return;
  
  const date = panel.querySelector('.lq-date').value;
  const content = panel.querySelector('.lq-content').value.trim();
  const updater = panel.querySelector('.lq-updater').value.trim();
  
  if (!date) { panel.querySelector('.lq-status').textContent = '❌ 请选择日期'; return; }
  if (!content) { panel.querySelector('.lq-status').textContent = '❌ 请填写进展内容'; return; }
  
  const btn = panel.querySelector('.lq-submit');
  const statusEl = panel.querySelector('.lq-status');
  btn.disabled = true;
  btn.textContent = '提交中...';
  statusEl.textContent = '';
  
  try {
    const data = JSON.parse(JSON.stringify(appData));
    const project = data.projects.find(p => p.id === projectId);
    if (!project) throw new Error('项目未找到');
    
    const timelineEntry = { date, content };
    if (updater) timelineEntry.updater = updater;

let importData = null; // 存储解析后的导入数据
let importFileName = '';
let importFileType = ''; // 'json' | 'excel' | 'csv'
let importMapping = {}; // 列映射关系

function openImportModal() {

function resetImportState() {

  importFileName = '';
  importFileType = '';
  importMapping = {};
  document.getElementById('importFileInput').value = '';
  document.getElementById('importPreviewArea').innerHTML = '';
  document.getElementById('importActions').style.display = 'none';

// 拖拽支持
document.addEventListener('DOMContentLoaded', () => {
  const dz = document.getElementById('importDropzone');
  if (!dz) return;
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleImportFile(e.dataTransfer.files[0]);
  });
});

function handleImportFile(file) {
  if (!file) return;
  importFileName = file.name;
  const ext = file.name.split('.').pop().toLowerCase();
  const status = document.getElementById('importStatus');
  
  if (ext === 'json') {
    importFileType = 'json';
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        processJsonImport(parsed);
      } catch (err) {
        status.textContent = '❌ JSON 解析失败: ' + err.message;
        status.className = 'import-status error';
      }
    };
    reader.readAsText(file, 'UTF-8');
  } else if (ext === 'xlsx' || ext === 'xls') {
    importFileType = 'excel';
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        processTableImport(jsonData, sheetName);
      } catch (err) {
        status.textContent = '❌ Excel 解析失败: ' + err.message;
        status.className = 'import-status error';
      }
    };
    reader.readAsArrayBuffer(file);
  } else if (ext === 'csv') {
    importFileType = 'csv';
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const text = e.target.result;
        const parsed = parseCSV(text);
        processTableImport(parsed, 'CSV');
      } catch (err) {
        status.textContent = '❌ CSV 解析失败: ' + err.message;
        status.className = 'import-status error';
      }
    };
    reader.readAsText(file, 'UTF-8');
  } else {
    status.textContent = '❌ 不支持的文件格式，请上传 JSON / Excel / CSV 文件';
    status.className = 'import-status error';
  }
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('CSV 数据为空');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
    const row = {};
    headers.forEach((h, idx) => row[h] = values[idx] || '');
    result.push(row);
  }
  return result;
}

// 处理 JSON 格式导入
function processJsonImport(parsed) {
  const previewArea = document.getElementById('importPreviewArea');
  
  // 检查是否是看板数据格式（有 projects 数组）
  if (parsed.projects && Array.isArray(parsed.projects)) {
    importData = { type: 'full', data: parsed };
    const projCount = parsed.projects.length;
    const totalEntries = parsed.projects.reduce((sum, p) => sum + (p.timeline ? p.timeline.length : 0), 0);
    
    let previewHtml = `
      <div class="import-preview">
        <div class="import-preview-header">
          <div class="file-info">
            <span class="fname">📄 ${importFileName}</span>
            <span class="fstats">✅ ${projCount} 个项目 · ${totalEntries} 条进展记录</span>
          </div>
        </div>
        <div class="import-preview-body">
          <table><thead><tr>
            <th>项目名称</th><th>优先级</th><th>完成度</th><th>最近更新</th><th>更新次数</th>
          </tr></thead><tbody>`;
    
    parsed.projects.forEach(p => {
      previewHtml += `<tr>
        <td>${p.name || '-'}</td>
        <td>${p.priority || '-'}</td>
        <td>${p.completion ? (parseFloat(p.completion) * 100).toFixed(0) + '%' : '-'}</td>
        <td>${p.latestUpdate || '-'}</td>
        <td>${p.totalUpdates || (p.timeline ? p.timeline.length : 0)}</td>
      </tr>`;
    });
    
    previewHtml += '</tbody></table></div></div>';
    previewHtml += `
      <div class="import-options">
        <label><input type="radio" name="importMode" value="merge" checked> 合并到现有数据（相同项目名追加记录）</label>
        <label><input type="radio" name="importMode" value="replace"> 完全替换现有数据</label>
      </div>`;
    
    previewArea.innerHTML = previewHtml;
  } else if (Array.isArray(parsed)) {
    // 纯数组格式，按表格处理
    processTableImport(parsed, 'JSON 数组');
    return;
  } else {
    document.getElementById('importStatus').textContent = '❌ 无法识别的数据格式。支持包含 projects 数组的看板数据或项目记录数组。';
    document.getElementById('importStatus').className = 'import-status error';
    return;
  }
  
  document.getElementById('importActions').style.display = 'flex';
}

// 处理表格格式导入（Excel/CSV/JSON数组）
function processTableImport(rows, sourceName) {
  if (!rows || rows.length === 0) {
    document.getElementById('importStatus').textContent = '❌ 文件内容为空';
    document.getElementById('importStatus').className = 'import-status error';
    return;
  }
  
  const headers = Object.keys(rows[0]);
  const previewArea = document.getElementById('importPreviewArea');
  
  // 自动检测列映射
  const fieldMap = {
    '项目': ['项目', '项目名称', 'project', 'name', '项目名', '客户名称', '客户'],
    '日期': ['日期', 'date', '时间', '更新时间', '更新日期', '跟进日期'],
    '内容': ['内容', '进展', 'content', '进展内容', '跟进内容', '描述', '备注', '说明', '详情'],
    '更新人': ['更新人', 'updater', '负责人', '跟进人', '操作人', '填写人'],
    '优先级': ['优先级', 'priority', '重要程度', '紧急程度'],
    '完成度': ['完成度', 'completion', '进度', '完成率', '完成比例']
  };
  
  importMapping = {};
  Object.keys(fieldMap).forEach(field => {
    const keywords = fieldMap[field];
    for (const h of headers) {
      if (keywords.some(k => h.toLowerCase().includes(k.toLowerCase()))) {
        importMapping[field] = h;
        break;
      }
    }
  });
  
  // 构建映射选择器
  const fieldLabels = {
    '项目': '项目名称',
    '日期': '日期',
    '内容': '进展内容',
    '更新人': '更新人',
    '优先级': '优先级',
    '完成度': '完成度'
  };
  
  let mappingHtml = '<div class="import-mapping"><div class="mapping-title">📋 字段映射（自动检测，可手动调整）</div><div class="mapping-grid">';
  Object.keys(fieldLabels).forEach(field => {
    const current = importMapping[field] || '';
    mappingHtml += `<div class="mapping-item">
      <span class="mapping-label">${fieldLabels[field]}</span>
      <select id="mapping-${field}" onchange="importMapping['${field}']=this.value">
        <option value="">-- 不映射 --</option>
        ${headers.map(h => `<option value="${h}" ${h === current ? 'selected' : ''}>${h}</option>`).join('')}
      </select>
    </div>`;
  });
  mappingHtml += '</div></div>';
  
  // 预览表格（最多显示20行）
  const displayRows = rows.slice(0, 20);
  let tableHtml = `
    <div class="import-preview">
      <div class="import-preview-header">
        <div class="file-info">
          <span class="fname">📄 ${importFileName}</span>
          <span class="fstats">✅ ${rows.length} 条记录 (${sourceName})</span>
        </div>
      </div>
      <div class="import-preview-body">
        <table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
  
  displayRows.forEach(row => {
    tableHtml += '<tr>' + headers.map(h => `<td>${String(row[h] || '').substring(0, 50)}</td>`).join('') + '</tr>';
  });
  
  if (rows.length > 20) {
    tableHtml += `<tr><td colspan="${headers.length}" style="text-align:center;color:var(--text-secondary)">... 还有 ${rows.length - 20} 条记录</td></tr>`;
  }
  
  tableHtml += '</tbody></table></div></div>';
  
  previewArea.innerHTML = tableHtml + mappingHtml;
  importData = { type: 'table', data: rows, source: sourceName };
  document.getElementById('importActions').style.display = 'flex';
}

// 执行导入
async function submitImport() {
  if (!importData) return;
  
  const btn = document.getElementById('btnImportSubmit');
  btn.disabled = true;
  btn.textContent = '导入中...';
  showImportStatus('正在准备数据...', '');

  try {
    const currentData = JSON.parse(JSON.stringify(appData));
    
    let newData;
    let commitMessage;
    
    if (importData.type === 'full') {
      // 完整看板数据格式
      const mode = document.querySelector('input[name="importMode"]:checked')?.value || 'merge';
      if (mode === 'replace') {
        newData = importData.data;
        commitMessage = `导入文件(替换): ${importFileName}`;
      } else {
        // 合并模式
        newData = JSON.parse(JSON.stringify(currentData)); // deep copy
        importData.data.projects.forEach(importedProject => {
          const existing = newData.projects.find(p => p.name === importedProject.name);
          if (existing) {
            // 追加不重复的 timeline 条目
            const existingDates = new Set(existing.timeline.map(t => t.date + '|' + t.content));
            (importedProject.timeline || []).forEach(entry => {
              const key = entry.date + '|' + entry.content;
              if (!existingDates.has(key)) {
                existing.timeline.unshift(entry);
                existingDates.add(key);
              }
            });
            existing.totalUpdates = existing.timeline.length;
            if (importedProject.latestUpdate > existing.latestUpdate) {
              existing.latestUpdate = importedProject.latestUpdate;
            }
          } else {
            // 新项目
            const maxId = newData.projects.reduce((max, p) => Math.max(max, p.id), 0);
            importedProject.id = maxId + 1;
            newData.projects.push(importedProject);
          }
        });
        commitMessage = `导入文件(合并): ${importFileName}`;
      }
    } else if (importData.type === 'table') {
      // 表格格式：根据映射关系生成数据
      newData = JSON.parse(JSON.stringify(currentData));
      const rows = importData.data;
      const nameField = importMapping['项目'];
      const dateField = importMapping['日期'];
      const contentField = importMapping['内容'];
      const updaterField = importMapping['更新人'];
      const priorityField = importMapping['优先级'];
      const completionField = importMapping['完成度'];
      
      if (!nameField && !contentField) {
        throw new Error('至少需要映射「项目名称」或「进展内容」字段');
      }
      
      let addedCount = 0;
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      
      rows.forEach(row => {
        const projName = nameField ? String(row[nameField] || '').trim() : '';
        const date = dateField ? String(row[dateField] || '').trim() : todayStr;
        const content = contentField ? String(row[contentField] || '').trim() : '';
        const updater = updaterField ? String(row[updaterField] || '').trim() : '';
        const priority = priorityField ? String(row[priorityField] || '').trim() : '';
        const completion = completionField ? String(row[completionField] || '').trim() : '';
        
        if (!projName && !content) return;
        
        // 查找或创建项目
        let project = projName ? newData.projects.find(p => p.name === projName) : null;
        
        if (!project && projName) {
          const maxId = newData.projects.reduce((max, p) => Math.max(max, p.id), 0);
          project = {
            id: maxId + 1,
            name: projName,
            priority: priority || '高',
            completion: completion || '0',
            latestUpdate: date,
            totalUpdates: 0,
            timeline: []
          };
          newData.projects.push(project);
        }
        
        if (project && content) {
          const entry = { date, content };
          if (updater) entry.updater = updater;
          project.timeline.unshift(entry);
          project.totalUpdates = (project.totalUpdates || 0) + 1;
          if (date > project.latestUpdate) project.latestUpdate = date;
          if (priority) project.priority = priority;
          if (completion) project.completion = completion;
          addedCount++;
        }
      });
      
      newData.lastUpdated = todayStr;
      commitMessage = `导入文件: ${importFileName} (${addedCount}条记录)`;
    }
    
    // 保存到云存储
    await saveAppData(newData, commitMessage);
    
    showImportStatus('✅ 导入成功！页面即将刷新数据...', 'success');
    
    setTimeout(() => {
      appData = newData;
      invalidatePCIndex();
      renderTrackingView();
      renderDatabaseView();
      document.getElementById('lastUpdated').textContent = '数据更新: ' + newData.lastUpdated;
      closeImportModal();
    }, 1500);
    
  } catch (err) {
    showImportStatus('❌ ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = '确认导入';
  }
}

function showImportStatus(msg, type) {
  const el = document.getElementById('importStatus');
  el.textContent = msg;
  el.className = 'import-status' + (type ? ' ' + type : '');
}

  return loadData().then(() => {
    if (!applyHashRoute()) switchView('overview');
  });
};

// ---------- 0. 工具 ----------

};

const PROJ_COLORS = ['#3b9eff', '#22c55e', '#f59e0b', '#8b5cf6', '#14b8a6',
                     '#ff5a5f', '#eab308', '#ec4899', '#0ea5e9', '#84cc16'];

function projColor(id) { return PROJ_COLORS[(Number(id) || 0) % PROJ_COLORS.length]; }

// 汇报视图过滤：排除测试/占位数据，避免污染对外汇报口径
const HIDDEN_PROJECT_RE = /^(测试|test|demo|示例|样例)$/i;
function visibleProjects() {
  return (appData && appData.projects ? appData.projects : [])
    .filter(p => p && p.name && !HIDDEN_PROJECT_RE.test(String(p.name).trim()));
}
function catMeta(k) { return CAT_META[k] || { icon: '🏷', color: '#6b7280' }; }

function esc2(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function rgba(hex, a) {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function personColor2(name) {
  const P = ['#3b9eff', '#22c55e', '#f59e0b', '#8b5cf6', '#ff5a5f', '#14b8a6',
             '#eab308', '#ec4899', '#0ea5e9', '#a3e635'];
  let h = 0;
  const s = String(name || '?');
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return P[Math.abs(h) % P.length];
}

function whoBadge(name) {
  if (!name) return '';
  const c = personColor2(name);
  return `<span class="who"><span class="who-av" style="background:${c}">${esc2(String(name).charAt(0))}</span>${esc2(name)}</span>`;
}

// 今日日期
function todayStr2() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// 距今天数
function daysAgo(dateStr) {
  if (!dateStr) return null;
  const t = new Date(String(dateStr).replace(/-/g, '/') + ' 00:00:00').getTime();
  if (isNaN(t)) return null;
  const now = new Date(todayStr2().replace(/-/g, '/') + ' 00:00:00').getTime();
  return Math.round((now - t) / 86400000);
}

// 项目状态判定（老板视角）
function projStatus(p) {
  if (p.priority === '战败') return { key: 'lost', label: '已战败', cls: 'tag-lost', ico: '✕' };
  const pct = parseFloat(p.completion);
  if (!isNaN(pct) && pct >= 0.99) return { key: 'done', label: '已完成', cls: 'tag-done', ico: '✓' };
  const d = daysAgo(p.latestUpdate);
  if (d !== null && d >= 14) return { key: 'stall', label: `停滞 ${d} 天`, cls: 'tag-stall', ico: '⚠' };
  if (d !== null && d <= 7) return { key: 'active', label: '本周活跃', cls: 'tag-active', ico: '●' };
  return { key: 'run', label: '推进中', cls: 'tag-run', ico: '→' };
}

function prioTag(p) {
  const pr = String(p.priority || '');
  const cls = pr === '高' ? 'tag-high' : pr === '中' ? 'tag-mid' : pr === '低' ? 'tag-low' : 'tag-ghost';
  return `<span class="tag ${cls}">${esc2(pr || '未定')}</span>`;
}

// 从进展文本中抽取"下一步"提示
function extractNextStep(content) {
  if (!content) return null;
  const lines = String(content).split('\n');
  const tagged = lines.find(l => /^(📌)?下一步[：:]/.test(l.trim()));
  if (tagged) return tagged.replace(/^(📌)?下一步[：:]\s*/, '').trim();
  const pats = [
    /(?:明天|明日|后天|下周[一二三四五六日]?|本周[一二三四五六日]?|周[一二三四五六日]|今晚|月底|月初)[^，。；\n]{2,26}/,
    /(?:准备|催|追|约|沟通|面谈|实地|拜访|提交|提供|确认|推进|对接)[^，。；\n]{3,26}/
  ];
  for (const re of pats) {
    const m = String(content).match(re);
    if (m && m[0].length > 4) return m[0].replace(/[，,。].*$/, '').trim();
  }
  return null;
}

// ---------- 1. 客户-项目匹配引擎 ----------
// 优先级：显式映射 projectCustomers > businessPartners.relatedProject > 名称/关键词推断
function buildProjectCustomerIndex() {
  const byProject = {};   // projectName -> [{name, category, industry, status, issue, direction, source, confidence}]
  const byCustomer = {};  // customerName -> {name, category, industry, projects:[...], status, issue, direction, latestUpdate}
  if (!appData) return { byProject, byCustomer };

  const push = (projName, cust) => {
    if (!projName) return;
    if (!byProject[projName]) byProject[projName] = [];
    if (!byProject[projName].some(x => x.name === cust.name)) byProject[projName].push(cust);
  };

  // 1.1 显式映射（数据层 projectCustomers: { "项目名": ["客户名", ...] }）
  const explicit = appData.projectCustomers || {};

  // 1.2 业务合作方（自带 relatedProject，最可信）
  (appData.businessPartners || []).forEach(p => {
    const cust = {
      name: p.name,
      category: p.type || '业务合作方',
      industry: '',
      status: p.status || '',
      issue: p.issue || '',
      direction: p.direction || '',
      source: 'business',
      confidence: 'high'
    };
    const target = p.relatedProject || p.name;
    if ((appData.projects || []).some(x => x.name === target)) push(target, cust);
    else if ((appData.projects || []).some(x => x.name === p.name)) push(p.name, cust);
    else push(target, cust); // 保留无主关联，便于排查
  });

  // 1.3 场地合作方 → 归属「场地合作」项目
  (appData.venuePartners || []).forEach(p => {
    push('场地合作', {
      name: p.name,
      category: '场地合作方',
      industry: '',
      status: '合作洽谈中',
      issue: '',
      direction: String(p.content || '').slice(0, 40),
      source: 'venue',
      confidence: 'high'
    });
  });

  // 1.4 行业伙伴：按方向/状态关键词归属
  (appData.industryPartners || []).forEach(p => {
    const text = (p.direction || '') + ' ' + (p.status || '');
    const cust = {
      name: p.company,
      category: '潜在客户',
      industry: p.industry || '',
      status: p.status || '',
      issue: p.issue || '',
      direction: p.direction || '',
      source: 'industry',
      confidence: 'medium'
    };
    if (/展厅|检测|延保|销售|售前/.test(text)) push('场地合作', cust);
    else if (!byProject[p.company]) { /* 无匹配项目时仅在客户侧保留 */ }
  });

  // 1.5 显式映射覆盖/补充（最高优先级，可指定多个项目）
  Object.keys(explicit).forEach(projName => {
    (explicit[projName] || []).forEach(custName => {
      const exists = (byProject[projName] || []).some(x => x.name === custName);
      if (exists) return;
      const bp = (appData.businessPartners || []).find(x => x.name === custName);
      const vp = (appData.venuePartners || []).find(x => x.name === custName);
      const ip = (appData.industryPartners || []).find(x => x.company === custName);
      push(projName, {
        name: custName,
        category: (bp && bp.type) || (vp ? '场地合作方' : (ip ? '潜在客户' : '未分类')),
        industry: (ip && ip.industry) || '',
        status: (bp && bp.status) || (ip && ip.status) || '',
        issue: (bp && bp.issue) || (ip && ip.issue) || '',
        direction: (bp && bp.direction) || (ip && ip.direction) || (vp ? String(vp.content || '').slice(0, 40) : ''),
        source: bp ? 'business' : (vp ? 'venue' : 'industry'),
        confidence: 'explicit'
      });
    });
  });

  // 1.6 反向索引：客户 → 项目
  Object.keys(byProject).forEach(projName => {
    const proj = (appData.projects || []).find(x => x.name === projName);
    byProject[projName].forEach(c => {
      if (!byCustomer[c.name]) {
        byCustomer[c.name] = {
          name: c.name, category: c.category, industry: c.industry,
          status: c.status, issue: c.issue, direction: c.direction,
          projects: [], latestUpdate: '', totalUpdates: 0
        };
      }
      const rec = byCustomer[c.name];
      if (!rec.projects.some(x => x.name === projName)) {
        rec.projects.push({
          name: projName,
          projectId: proj ? proj.id : null,
          priority: proj ? proj.priority : '',
          completion: proj ? proj.completion : '',
          latestUpdate: proj ? proj.latestUpdate : '',
          totalUpdates: proj ? proj.totalUpdates : 0,
          latestContent: proj && proj.timeline && proj.timeline[0] ? proj.timeline[0].content : ''
        });
      }
      if (!rec.status && c.status) rec.status = c.status;
      if (!rec.issue && c.issue) rec.issue = c.issue;
      if (!rec.direction && c.direction) rec.direction = c.direction;
      if (!rec.industry && c.industry) rec.industry = c.industry;
      const lu = proj ? proj.latestUpdate : '';
      if (lu && lu > rec.latestUpdate) rec.latestUpdate = lu;
      rec.totalUpdates += proj ? (proj.totalUpdates || 0) : 0;
    });
  });

  return { byProject, byCustomer };
}

// ---------- 2. KPI 统计 ----------
function computeStats() {
  const projects = visibleProjects();
  const active = projects.filter(p => p.priority !== '战败' && !(parseFloat(p.completion) >= 0.99));
  const totalUpdates = projects.reduce((s, p) => s + (p.totalUpdates || 0), 0);

  let weekUpdates = 0;
  projects.forEach(p => {
    (p.timeline || []).forEach(e => {
      const d = daysAgo(e.date);
      if (d !== null && d >= 0 && d <= 7) weekUpdates++;
    });
  });

  const stalled = projects.filter(p => {
    const st = projStatus(p);
    return st.key === 'stall';
  });

  // 数据整体陈旧时（最新一条也超过 30 天），停滞指标会失真，需向老板标注
  const newestOverall = projects.reduce((m, p) => (p.latestUpdate > m ? p.latestUpdate : m), '');
  const dataAge = daysAgo(newestOverall);
  const stallReliable = dataAge === null || dataAge <= 30;
  const stallExcluded = !stallReliable ? projects.filter(p => projStatus(p).key === 'stall').length : 0;

  const risks = [];
  projects.forEach(p => {
    const st = projStatus(p);
    const custs = pcIndex().byProject[p.name] || [];
    const issueCusts = custs.filter(c => c.issue);
    if (st.key === 'stall') {
      risks.push({ type: 'stall', ico: '⏱', projectId: p.id, projectName: p.name,
        desc: `已 ${daysAgo(p.latestUpdate)} 天无更新，最后进展：${String((p.timeline[0] || {}).content || '').slice(0, 42)}`,
        color: '#ff5a5f' });
    }
    issueCusts.forEach(c => {
      risks.push({ type: 'issue', ico: '⚠', projectId: p.id, projectName: p.name,
        desc: `${c.name} 待解决：${c.issue}`, color: '#f59e0b' });
    });
    if (!custs.length && p.priority !== '战败' && !/测试/.test(p.name)) {
      risks.push({ type: 'noref', ico: '🔗', projectId: p.id, projectName: p.name,
        desc: '尚未关联客户/合作方，建议补充对接主体', color: '#8b9bb0' });
    }
  });

  const customers = Object.values(pcIndex().byCustomer);
  const orphanCustomers = customers.filter(c => !c.projects.length);

  return {
    totalProjects: projects.length,
    activeProjects: active.length,
    totalUpdates, weekUpdates,
    stalled, risks, customers,
    orphanCustomers,
    dataAge, stallReliable, stallExcluded,
    activeCustomers: customers.filter(c => c.projects.length).length,
    recentDays: (() => {
      const d = new Date(); d.setDate(d.getDate() - 7);
      return `${d.getMonth() + 1}/${d.getDate()} 起`;
    })()
  };
}

            <div class="pbar"><i class="${pct >= 99 ? 'done' : ''}" style="width:${hasPct ? pct : 0}%"></i></div>
          </div>
          <div class="pcard-res">
            <span class="pcard-res-label">👥 关联客户</span>
            ${customerChips(p.name, 6)}
          </div>
        </div>
        <div class="pcard-side">
          <div class="pcard-side-date">
            <span>${esc2(String(p.latestUpdate || '').substring(5).replace('-', '/'))}</span>
            ${latest ? whoBadge(latest.updater) : ''}
          </div>
          <div class="pcard-side-content" onclick="showDetail(${p.id})" title="点击查看完整进展">
            ${esc2(latest ? String(latest.content || '').split('\n')[0] : '暂无进展记录')}
          </div>
          <div class="pcard-actions">
            <button class="btn-mini" onclick="toggleProjFeed(${p.id}, this)">📜 更新记录</button>
            <button class="btn-mini btn-mini-accent" onclick="showDetail(${p.id})">详情 →</button>
          </div>
        </div>
      </div>
      <div class="pcard-feed" id="pfeed-${p.id}">
        <div class="pcard-feed-inner">${timelineRows || '<div class="mx-none">暂无更新记录</div>'}</div>
      </div>
    </div>`;
}

function toggleProjFeed(id, btn) {
  const el = document.getElementById('pfeed-' + id);
  if (!el) return;
  const open = el.classList.toggle('open');
  if (btn) btn.textContent = open ? '📜 收起记录' : '📜 更新记录';
}

// ---------- 5. 项目主线视图 ----------
let projectSort = 'priority';   // priority | latest | progress | name
let projectFilter = 'all';      // all | high | active | stall | risk

function setProjectSort(mode, btn) {
  projectSort = mode;
  document.querySelectorAll('#projSortBar .chip').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  renderProjectBoard();
}

function setProjectFilter(mode, btn) {
  projectFilter = mode;
  document.querySelectorAll('#projFilterBar .chip').forEach(b => b.classList.toggle('active', b.dataset.filter === mode));
  renderProjectBoard();
}

function renderProjectBoard() {
  const el = document.getElementById('projectBoardView');
  if (!el) return;
  const allVisible = visibleProjects();
  let list = allVisible.slice();

  // 过滤
  if (projectFilter === 'high') list = list.filter(p => p.priority === '高');
  else if (projectFilter === 'active') list = list.filter(p => projStatus(p).key === 'active');
  else if (projectFilter === 'stall') list = list.filter(p => projStatus(p).key === 'stall');
  else if (projectFilter === 'risk') list = list.filter(p => {
    const st = projStatus(p);
    return st.key === 'stall' || (pcIndex().byProject[p.name] || []).some(c => c.issue);
  });

  // 排序
  const prioRank = { '高': 0, '中': 1, '低': 2, '战败': 9 };
  if (projectSort === 'priority') {
    list.sort((a, b) => {
      const ra = prioRank[a.priority] != null ? prioRank[a.priority] : 5;
      const rb = prioRank[b.priority] != null ? prioRank[b.priority] : 5;
      if (ra !== rb) return ra - rb;
      return String(b.latestUpdate).localeCompare(String(a.latestUpdate));
    });
  } else if (projectSort === 'latest') {
    list.sort((a, b) => String(b.latestUpdate).localeCompare(String(a.latestUpdate)));
  } else if (projectSort === 'progress') {
    list.sort((a, b) => {
      const pa = parseFloat(a.completion); const pb = parseFloat(b.completion);
      return (isNaN(pb) ? -1 : pb) - (isNaN(pa) ? -1 : pa);
    });
  } else {
    list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh'));
  }

  el.innerHTML = `
    <div class="feed-toolbar">
      <div class="chipbar" id="projFilterBar">
        <button class="chip${projectFilter === 'all' ? ' active' : ''}" data-filter="all" onclick="setProjectFilter('all')">全部 ${allVisible.length}</button>
        <button class="chip${projectFilter === 'high' ? ' active' : ''}" data-filter="high" onclick="setProjectFilter('high')">高优先级 ${allVisible.filter(p => p.priority === '高').length}</button>
        <button class="chip${projectFilter === 'active' ? ' active' : ''}" data-filter="active" onclick="setProjectFilter('active')">本周活跃 ${allVisible.filter(p => projStatus(p).key === 'active').length}</button>
        <button class="chip${projectFilter === 'stall' ? ' active' : ''}" data-filter="stall" onclick="setProjectFilter('stall')">停滞预警 ${(appData.projects || []).filter(p => projStatus(p).key === 'stall').length}</button>
        <button class="chip${projectFilter === 'risk' ? ' active' : ''}" data-filter="risk" onclick="setProjectFilter('risk')">含风险 ${(appData.projects || []).filter(p => projStatus(p).key === 'stall' || (pcIndex().byProject[p.name] || []).some(c => c.issue)).length}</button>
      </div>
      <div style="flex:1"></div>
      <div class="chipbar" id="projSortBar">
        <span style="font-size:11px;color:var(--text-dim);align-self:center;margin-right:2px">排序</span>
        <button class="chip${projectSort === 'priority' ? ' active' : ''}" data-sort="priority" onclick="setProjectSort('priority')">优先级</button>
        <button class="chip${projectSort === 'latest' ? ' active' : ''}" data-sort="latest" onclick="setProjectSort('latest')">最近更新</button>
        <button class="chip${projectSort === 'progress' ? ' active' : ''}" data-sort="progress" onclick="setProjectSort('progress')">完成度</button>
        <button class="chip${projectSort === 'name' ? ' active' : ''}" data-sort="name" onclick="setProjectSort('name')">名称</button>
      </div>
    </div>
    ${list.length ? `<div class="plist">${list.map(p => projCardHTML(p)).join('')}</div>`
      : `<div class="alert-empty">该筛选条件下暂无项目</div>`}
  `;
}

// ---------- 6. 更新动态 Feed ----------
let feedRange = 0;         // 0=全部(默认，避免数据陈旧时空白) | 7 | 30
let feedProjectId = 'all';

function setFeedRange(v) {
  feedRange = Number(v);
  document.querySelectorAll('#feedRangeBar .chip').forEach(b => b.classList.toggle('active', Number(b.dataset.range) === feedRange));
  renderFeedView();
}
function setFeedProject(v) {
  feedProjectId = v;
  document.querySelectorAll('#feedProjBar .chip').forEach(b => b.classList.toggle('active', b.dataset.pid === v));
  renderFeedView();
}

const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function weekdayOf(dateStr) {
  const d = new Date(String(dateStr).replace(/-/g, '/') + ' 00:00:00');
  return isNaN(d.getTime()) ? '' : WD[d.getDay()];
}

function renderFeedView() {
  const el = document.getElementById('feedView');
  if (!el) return;

  // 收集全部进展条目
  let entries = [];
  visibleProjects().forEach(p => {
    (p.timeline || []).forEach(e => {
      entries.push({
        projectId: p.id, projectName: p.name, priority: p.priority,
        date: e.date, content: e.content, updater: e.updater || '',
        color: projColor(p.id)
      });
    });
  });

  if (feedProjectId !== 'all') entries = entries.filter(e => String(e.projectId) === String(feedProjectId));
  if (feedRange > 0) entries = entries.filter(e => { const d = daysAgo(e.date); return d !== null && d >= 0 && d <= feedRange; });
  entries.sort((a, b) => String(b.date).localeCompare(String(a.date)));

  // 按日期分组
  const groups = {};
  entries.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
  const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  const projOptions = visibleProjects()
    .filter(p => (p.timeline || []).length)
    .sort((a, b) => String(b.latestUpdate).localeCompare(String(a.latestUpdate)));

  // 数据整体较旧时的提示
  const newest = (appData.projects || []).reduce((m, p) => (p.latestUpdate > m ? p.latestUpdate : m), '');
  const newestDays = daysAgo(newest);
  const staleHint = (newestDays !== null && newestDays > 30)
    ? `<div class="alert-panel" style="margin-bottom:16px;border-color:rgba(245,158,11,.22)">
         <div style="display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-soft)">
           <span style="font-size:15px">🕐</span>
           <span>数据最近一次更新为 <b style="color:#fbbf24">${esc2(newest)}</b>（${newestDays} 天前），已默认展示<b>全部历史动态</b>。</span>
         </div>
       </div>` : '';

  el.innerHTML = `
    ${staleHint}
    <div class="feed-toolbar">
      <div class="chipbar" id="feedRangeBar">
        <button class="chip${feedRange === 0 ? ' active' : ''}" data-range="0" onclick="setFeedRange(0)">全部</button>
        <button class="chip${feedRange === 7 ? ' active' : ''}" data-range="7" onclick="setFeedRange(7)">近 7 天</button>
        <button class="chip${feedRange === 30 ? ' active' : ''}" data-range="30" onclick="setFeedRange(30)">近 30 天</button>
      </div>
      <div style="flex:1"></div>
      <div class="section-desc">共 <b style="color:var(--accent)">${entries.length}</b> 条进展</div>
    </div>
    <div class="chipbar" id="feedProjBar" style="margin-bottom:16px">
      <button class="chip${feedProjectId === 'all' ? ' active' : ''}" data-pid="all" onclick="setFeedProject('all')">全部项目</button>
      ${projOptions.map(p => `<button class="chip${String(feedProjectId) === String(p.id) ? ' active' : ''}" data-pid="${p.id}" onclick="setFeedProject(${p.id})">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${projColor(p.id)};margin-right:5px;vertical-align:middle"></span>${esc2(p.name)}</button>`).join('')}
    </div>
    ${dates.length ? dates.map(date => {
      const d = daysAgo(date);
      const dayLabel = d === 0 ? '今天' : d === 1 ? '昨天' : `${d} 天前`;
      return `
        <div class="daygroup">
          <div class="daygroup-head">
            <span class="daygroup-date">${esc2(date.substring(5).replace('-', '/'))}</span>
            <span class="daygroup-wd">${weekdayOf(date)} · ${dayLabel}</span>
            <span class="daygroup-count">${groups[date].length} 条</span>
            <div class="section-line"></div>
          </div>
          ${groups[date].map(e => {
            const nx = extractNextStep(e.content);
            const lines = String(e.content || '').split('\n').filter(Boolean);
            const main = lines.filter(l => !/^(📌)?下一步[：:]/.test(l.trim())).join(' ');
            return `
              <div class="feedcard">
                <div class="feedcard-left">
                  <span class="feedcard-proj" onclick="showDetail(${e.projectId})">
                    <span class="fp-dot" style="background:${e.color}"></span>
                    <span class="fp-name">${esc2(e.projectName)}</span>
                  </span>
                  ${whoBadge(e.updater)}
                </div>
                <div class="feedcard-right">
                  <div class="feedcard-text">${esc2(main)}</div>
                  ${nx ? `<div class="feedcard-foot"><span class="feed-next">📌 下一步：${esc2(nx)}</span></div>` : ''}
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }).join('') : `<div class="alert-empty">该时间范围内暂无更新记录</div>`}
  `;
}

// ---------- 7. 客户资源矩阵 ----------

              <div class="alert-title">${esc2(p.name)} ${prioTag(p)}</div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="st-ico">📇</span>客户 × 项目 资源矩阵</div>

      <div class="matrix-wrap"><div class="matrix-scroll">

          <tbody>
            ${custs.map(c => {
              const m = catMeta(c.category);
              return `<tr>

// ---------- 8. 项目详情（含关联客户） ----------

// 包裹原有 showDetail，追加关联客户区块
(function patchShowDetail() {
  if (typeof window === 'undefined') return;
  const _orig = window.showDetail;
  window.showDetail = function (projectId) {
    _orig.apply(this, arguments);
    try {
      const p = appData && appData.projects.find(x => x.id === projectId);
      if (!p) return;
      const dv = document.getElementById('detailView');
      if (!dv) return;
      const holder = document.createElement('div');
      holder.innerHTML = renderDetailExtra(p);
      const qe = dv.querySelector('.detail-quick-edit');
      if (qe && qe.parentNode) qe.parentNode.insertBefore(holder.firstElementChild, qe);
      else dv.appendChild(holder.firstElementChild);
    } catch (e) { console.warn('detail extra failed', e); }
  };
})();

// ---------- 9. URL 深链（便于把指定视图直接发给老板） ----------
const VIEW_KEYS = ['overview', 'projects', 'match', 'feed', 'database'];
(function patchHashRouting() {
  if (typeof window === 'undefined') return;

  const _sw = window.switchView;
  window.switchView = function (view) {
    _sw.apply(this, arguments);
    const h = '#' + (view || 'overview');
    if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
  };

  const _sd = window.showDetail;
  window.showDetail = function (id) {
    _sd.apply(this, arguments);
    const h = '#project-' + id;
    if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
  };

  // 浏览器前进/后退 & 手动改 hash
  window.addEventListener('hashchange', () => {
    const h = String(location.hash || '').replace(/^#/, '');
    if (/^project-\d+$/.test(h)) {
      const id = Number(h.split('-')[1]);
      if (appData && appData.projects.some(p => p.id === id)) window.showDetail(id);
    } else if (VIEW_KEYS.indexOf(h) !== -1 && h !== currentView) {
      _sw.call(window, h);
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === h));
    }
  });
})();

// 应用启动时的 hash 深链
function applyHashRoute() {
  const h = String(location.hash || '').replace(/^#/, '');
  if (/^project-\d+$/.test(h)) {
    const id = Number(h.split('-')[1]);
    if (appData && appData.projects.some(p => p.id === id)) { showDetail(id); return true; }
  }
  if (VIEW_KEYS.indexOf(h) !== -1) { switchView(h); return true; }
  return false;
}
