<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>合同里程碑跟踪与提醒</title>
<style>
  :root {
    --bg: #0f1419;
    --bg-soft: #161c24;
    --bg-card: #1c242e;
    --bg-input: #11161d;
    --border: #2a3441;
    --border-soft: #222b36;
    --text: #e6edf3;
    --text-dim: #9aa7b4;
    --text-faint: #6b7785;
    --accent: #4f9cf9;
    --accent-soft: #1d3a5f;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #e3823c;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --radius: 10px;
    --shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: linear-gradient(180deg, #182230, #121821);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .5px; }
  .topbar .logo { font-size: 20px; }
  .topbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); background: #202b38; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #3d8ae8; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.danger { border-color: #5a2a2a; color: #ff8a82; }
  .btn.danger:hover { background: #2a1818; border-color: var(--red); }

  /* reminder banner */
  .reminder-banner {
    background: linear-gradient(90deg, #3a2b12, #2a2113);
    border-bottom: 1px solid var(--yellow);
    padding: 10px 22px;
    display: none;
    align-items: center; gap: 14px;
    font-size: 13px;
  }
  .reminder-banner.show { display: flex; }
  .reminder-banner .count {
    background: var(--yellow); color: #1a1305; font-weight: 700;
    border-radius: 20px; padding: 2px 10px; font-size: 12px;
  }
  .reminder-banner .items { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .reminder-banner a { color: var(--yellow); cursor: pointer; text-decoration: underline; }

  /* stats bar */
  .statsbar { display: flex; gap: 12px; padding: 16px 22px; flex-wrap: wrap; }
  .stat {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 12px 16px; min-width: 130px; flex: 1;
  }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .stat.red .num { color: var(--red); }
  .stat.orange .num { color: var(--orange); }
  .stat.green .num { color: var(--green); }
  .stat.blue .num { color: var(--blue); }

  /* tabs */
  .tabs { display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 16px; cursor: pointer; color: var(--text-dim);
    border-bottom: 2px solid transparent; font-size: 13px; user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .view { display: none; padding: 20px 22px; }
  .view.active { display: block; }

  /* contract cards */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select {
    background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 8px; font-size: 13px;
  }
  .contract-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  }
  .card .chead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card .cname { font-size: 15px; font-weight: 650; }
  .card .cmeta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--blue); margin-right: 4px; }
  .tag.amt { background: #1d3326; color: var(--green); }
  .ms-list { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .ms {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--border-soft); font-size: 13px;
  }
  .ms:last-child { border-bottom: none; }
  .ms .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .ms .msbody { flex: 1; min-width: 0; }
  .ms .mstitle { font-weight: 500; }
  .ms .msdate { font-size: 11px; color: var(--text-faint); }
  .ms .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.overdue { background: #3a1c1c; color: #ff8a82; }
  .badge.due { background: #3a2a12; color: #ffc266; }
  .badge.up { background: #16303f; color: #79c0ff; }
  .badge.done { background: #16301f; color: #7ee2a0; }
  .ms .mstools { display: flex; gap: 6px; }
  .iconbtn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px; }
  .iconbtn:hover { color: var(--text); background: #202b38; }
  .filechip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--blue); background: #132236; border: 1px solid #1d3a5f; padding: 2px 8px; border-radius: 8px; cursor: pointer; margin-top: 8px; }
  .filechip:hover { background: #182a44; }

  /* upcoming dashboard */
  .kanban { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .kcard {
    background: var(--bg-card); border: 1px solid var(--border-soft); border-left-width: 4px;
    border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
  }
  .kcard.overdue { border-left-color: var(--red); }
  .kcard.due { border-left-color: var(--orange); }
  .kcard.up { border-left-color: var(--blue); }
  .kcard .kcontract { font-size: 12px; color: var(--text-dim); }
  .kcard .ktitle { font-size: 15px; font-weight: 600; margin: 4px 0; }
  .kcard .kcount { font-size: 26px; font-weight: 800; }
  .kcard.overdue .kcount { color: var(--red); }
  .kcard.due .kcount { color: var(--orange); }
  .kcard.up .kcount { color: var(--blue); }
  .kcard .kunit { font-size: 13px; color: var(--text-dim); font-weight: 400; }
  .kcard .kdate { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
  .kcard .kremind { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  /* timeline */
  .timeline-wrap { overflow-x: auto; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px; }
  .tl-row { display: flex; align-items: center; margin-bottom: 14px; min-width: 720px; }
  .tl-label { width: 180px; flex-shrink: 0; font-size: 12px; color: var(--text-dim); padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-track { flex: 1; position: relative; height: 30px; }

  /* stats */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .chart-box { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px; }
  .chart-box h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .legend .li { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  /* modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px; overflow-y: auto;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 640px; box-shadow: var(--shadow); padding: 22px;
  }
  .modal h2 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); padding: 9px 11px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ms-edit { border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--bg-card); }
  .ms-edit .ms-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--text-dim); }
  .ms-edit .grid3 { display: grid; grid-template-columns: 1fr 110px 90px; gap: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .empty { color: var(--text-faint); text-align: center; padding: 50px 20px; font-size: 13px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--accent); color: var(--text);
    padding: 10px 18px; border-radius: 10px; box-shadow: var(--shadow); z-index: 200;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .perm-note { font-size: 12px; color: var(--orange); margin-left: 10px; }

  /* import modal */
  #importMapping select {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  #importPreview table td, #importPreview table th {
    padding: 5px 8px; border-bottom: 1px solid var(--border-soft); text-align: left; white-space: nowrap;
  }
  #importPreview table th { color: var(--text-dim); font-weight: 500; }
  #f_category { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 8px; font-size: 13px; font-family: inherit; }
</style>
</head>
<body>
<header class="topbar">
  <span class="logo">📑</span>
  <h1>合同里程碑跟踪与提醒</h1>
  <span class="spacer"></span>
  <button class="btn ghost sm" id="btnPerm">🔔 启用桌面提醒</button>
  <button class="btn ghost sm" id="btnImport">⬆️ 导入 Excel</button>
  <button class="btn primary" id="btnAdd">＋ 新增合同</button>
</header>

<div class="reminder-banner" id="reminderBanner">
  <span class="count" id="reminderCount">0</span>
  <span class="items" id="reminderItems"></span>
  <a id="reminderGoto">查看临近看板 →</a>
  <span class="spacer" style="flex:1"></span>
  <button class="btn sm ghost" id="reminderClose">知道了</button>
</div>

<div class="statsbar" id="statsbar"></div>

<div class="tabs">
  <div class="tab active" data-view="contracts">📁 合同列表</div>
  <div class="tab" data-view="upcoming">⏰ 临近到期看板</div>
  <div class="tab" data-view="timeline">📈 时间轴 / 甘特</div>
  <div class="tab" data-view="stats">📊 统计图表</div>
</div>

<div class="view active" id="view-contracts">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索合同名称 / 对方 / 节点…" style="min-width:240px" />
    <select id="filterCat"><option value="">全部类别</option></select>
    <select id="filterStatus">
      <option value="">全部状态</option>
      <option value="overdue">已逾期</option>
      <option value="due">即将到期</option>
      <option value="upcoming">未到期</option>
      <option value="done">已完成</option>
    </select>
  </div>
  <div class="contract-grid" id="contractGrid"></div>
</div>

<div class="view" id="view-upcoming">
  <div class="toolbar"><span class="hint">按剩余天数排序，优先展示最紧急的节点。点击「完成」可标记节点已办。</span></div>
  <div class="kanban" id="kanban"></div>
</div>

<div class="view" id="view-timeline">
  <div class="toolbar"><span class="hint">横轴为日期，圆点为上传日，菱形为里程碑节点到期日。可横向滚动。</span></div>
  <div class="timeline-wrap" id="timeline"></div>
</div>

<div class="view" id="view-stats">
  <div class="charts" id="charts"></div>
</div>

<!-- Modal -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2 id="modalTitle">新增合同</h2>
    <input type="hidden" id="f_id" />
    <div class="grid2">
      <div class="field">
        <label>合同名称 *</label>
        <input type="text" id="f_name" placeholder="如：XX 采购合同" />
      </div>
      <div class="field">
        <label>类别</label>
        <select id="f_category">
          <option value="合同协议">合同协议</option>
          <option value="人事档案">人事档案</option>
          <option value="财务档案">财务档案</option>
          <option value="其它">其它</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>对方 / 相对方</label>
        <input type="text" id="f_party" placeholder="甲方 / 乙方名称" />
      </div>
      <div class="field">
        <label>合同金额（元）</label>
        <input type="number" id="f_amount" placeholder="可选" min="0" />
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>上传时间 *</label>
        <input type="date" id="f_uploadDate" />
      </div>
      <div class="field">
        <label>附件（合同资料）</label>
        <input type="file" id="f_file" />
        <div class="hint" id="f_fileHint"></div>
      </div>
    </div>

    <div class="field">
      <label>关键里程碑节点</label>
      <div id="msContainer"></div>
      <button class="btn sm" id="btnAddMs" type="button">＋ 添加里程碑节点</button>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="btnCancel" type="button">取消</button>
      <button class="btn primary" id="btnSave" type="button">保存</button>
    </div>
  </div>
</div>

<!-- Import Excel Modal -->
<div class="modal-mask" id="importMask">
  <div class="modal" style="max-width:760px">
    <h2 id="importTitle">导入 Excel / CSV</h2>

    <div class="field" id="importPick">
      <label>选择文件（.xlsx / .xls / .csv）</label>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" />
      <div class="hint">建议列：合同名称、类别、对方、金额、上传时间、节点1名称、节点1到期日、节点1提前天、节点2…。列名找不到时会让你手动映射。类别须为：合同协议 / 人事档案 / 财务档案 / 其它。</div>
    </div>

    <div id="importStep2" style="display:none">
      <div class="field">
        <label>列映射（选择每一列对应的含义；留空表示忽略该列）</label>
        <div id="importMapping"></div>
      </div>
      <div class="field">
        <label>未识别到的类别将统一归入</label>
        <select id="importDefaultCat">
          <option value="合同协议">合同协议</option>
          <option value="人事档案">人事档案</option>
          <option value="财务档案">财务档案</option>
          <option value="其它" selected>其它</option>
        </select>
      </div>
      <div class="field">
        <label>数据预览（前 6 行）</label>
        <div id="importPreview" style="max-height:260px;overflow:auto;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:6px"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="importCancel" type="button">取消</button>
      <button class="btn primary" id="importNext" type="button" style="display:none">下一步：映射</button>
      <button class="btn primary" id="importConfirm" type="button" style="display:none">确认导入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="xlsx.full.min.js"></script>
<script>
"use strict";
/* ============ 数据层：IndexedDB ============ */
const DB_NAME = "contractTracker";
const DB_VER = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("contracts")) {
        const store = d.createObjectStore("contracts", { keyPath: "id" });
        store.createIndex("uploadDate", "uploadDate", { unique: false });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function getAllContracts() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("contracts", "readonly");
    const req = tx.objectStore("contracts").getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function putContract(c) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("contracts", "readwrite");
    tx.objectStore("contracts").put(c);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function deleteContract(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("contracts", "readwrite");
    tx.objectStore("contracts").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ============ 工具函数 ============ */
const $ = (sel) => document.querySelector(sel);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const fmtDate = (s) => s || "—";
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtMoney = (n) => (n == null || isNaN(n) || n === "") ? "" : "¥" + Number(n).toLocaleString("zh-CN");

function statusOf(ms, today) {
  if (ms.done) return "done";
  const left = daysBetween(today, ms.dueDate);
  if (left < 0) return "overdue";
  if (left <= (ms.remindDays || 0)) return "due";
  return "upcoming";
}
const STATUS_COLOR = { overdue: "var(--red)", due: "var(--orange)", upcoming: "var(--blue)", done: "var(--green)" };
const STATUS_LABEL = { overdue: "已逾期", due: "即将到期", upcoming: "未到期", done: "已完成" };

/* ============ 类别（四类档案） ============ */
const CATEGORIES = ["合同协议", "人事档案", "财务档案", "其它"];
const CAT_COLOR = {
  "合同协议": "#4f9cf9",
  "人事档案": "#bc8cff",
  "财务档案": "#3fb950",
  "其它":     "#9aa7b4",
};
// 归一化：旧数据可能是任意自由文本，映射进四类（含别名匹配）
function normalizeCat(v) {
  v = String(v == null ? "" : v).trim();
  if (!v) return "其它";
  if (CATEGORIES.includes(v)) return v;
  const low = v.toLowerCase();
  if (/人事|员工|档案|hr|人员|入职|离职|社保/.test(low) || /人/.test(v) && /事|员|档/.test(v)) return "人事档案";
  if (/财务|账|款|发票|财税|金|费|报销/.test(low)) return "财务档案";
  if (/合同|协议|采购|服务|租赁|销售|合作|保密/.test(low)) return "合同协议";
  return "其它";
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ============ 状态 ============ */
let contracts = [];
let activeView = "contracts";

/* ============ 渲染：统计条 ============ */
function renderStats() {
  const today = todayStr();
  let total = contracts.length, msAll = 0, overdue = 0, due = 0, upcoming = 0, done = 0, amtSum = 0;
  contracts.forEach(c => {
    (c.milestones || []).forEach(m => {
      msAll++;
      const st = statusOf(m, today);
      if (st === "overdue") overdue++;
      else if (st === "due") due++;
      else if (st === "upcoming") upcoming++;
      else done++;
    });
    if (c.amount) amtSum += Number(c.amount);
  });
  const boxes = [
    { num: total, lbl: "合同总数", cls: "blue" },
    { num: msAll, lbl: "里程碑节点", cls: "" },
    { num: due, lbl: "即将到期", cls: "orange" },
    { num: overdue, lbl: "已逾期", cls: "red" },
    { num: done, lbl: "已完成", cls: "green" },
    { num: fmtMoney(amtSum).replace("¥","¥"), lbl: "合同金额合计", cls: "green" },
  ];
  $("#statsbar").innerHTML = boxes.map(b =>
    `<div class="stat ${b.cls}"><div class="num">${esc(b.num)}</div><div class="lbl">${esc(b.lbl)}</div></div>`
  ).join("");
}

/* ============ 渲染：合同列表 ============ */
function renderContracts() {
  const today = todayStr();
  const q = $("#searchInput").value.trim().toLowerCase();
  const cat = $("#filterCat").value;
  const st = $("#filterStatus").value;

  // category options (fixed four classes)
  const cur = $("#filterCat").value;
  $("#filterCat").innerHTML = '<option value="">全部类别</option>' + CATEGORIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("#filterCat").value = cur;

  let list = contracts.filter(c => {
    if (cat && normalizeCat(c.category) !== cat) return false;
    if (q) {
      const hay = (c.name + " " + (c.party||"") + " " + (c.milestones||[]).map(m=>m.title).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (st) {
      const ms = (c.milestones||[]);
      if (!ms.length) return false;
      const has = ms.some(m => statusOf(m, today) === st);
      if (!has) return false;
    }
    return true;
  });
  // sort: overdue/due first
  const rank = { overdue: 0, due: 1, upcoming: 2, done: 3 };
  list.sort((a,b) => {
    const sa = Math.min(...(a.milestones||[]).map(m=>rank[statusOf(m,today)]), 9);
    const sb = Math.min(...(b.milestones||[]).map(m=>rank[statusOf(m,today)]), 9);
    return sa - sb;
  });

  const grid = $("#contractGrid");
  if (!list.length) {
    grid.innerHTML = `<div class="empty">${contracts.length ? "没有匹配的合同。" : "还没有合同，点击右上角「＋ 新增合同」开始吧。"}</div>`;
    return;
  }
  grid.innerHTML = list.map(c => {
    const ms = (c.milestones||[]).map(m => {
      const stt = statusOf(m, today);
      const left = daysBetween(today, m.dueDate);
      const leftTxt = m.done ? "已完成" : (left < 0 ? `逾期 ${Math.abs(left)} 天` : `剩 ${left} 天`);
      return `<div class="ms">
        <span class="dot" style="background:${STATUS_COLOR[stt]}"></span>
        <div class="msbody">
          <div class="mstitle">${esc(m.title)}</div>
          <div class="msdate">到期 ${fmtDate(m.dueDate)} · 提前 ${esc(m.remindDays||0)} 天提醒</div>
        </div>
        <span class="badge ${stt}">${leftTxt}</span>
        <div class="mstools">
          ${m.done ? "" : `<button class="iconbtn" title="标记完成" data-done="${c.id}|${m.id}">✓</button>`}
          <button class="iconbtn" title="删除节点" data-delms="${c.id}|${m.id}">🗑</button>
        </div>
      </div>`;
    }).join("");
    const fileChip = c.file ? `<div class="filechip" data-dl="${c.id}">📎 ${esc(c.file.name)} (${(c.file.size/1024).toFixed(0)} KB) ↓</div>` : "";
    return `<div class="card">
      <div class="chead">
        <div>
          <div class="cname">${esc(c.name)}</div>
          <div class="cmeta">上传 ${fmtDate(c.uploadDate)}${c.party?` · ${esc(c.party)}`:""}</div>
          <div style="margin-top:6px">
            ${c.category?`<span class="tag" style="background:${CAT_COLOR[normalizeCat(c.category)]}22;color:${CAT_COLOR[normalizeCat(c.category)]}">${esc(c.category)}</span>`:""}
            ${c.amount?`<span class="tag amt">${fmtMoney(c.amount)}</span>`:""}
          </div>
          ${fileChip}
        </div>
        <div class="mstools">
          <button class="iconbtn" title="编辑" data-edit="${c.id}">✏️</button>
          <button class="iconbtn" title="删除合同" data-del="${c.id}">🗑</button>
        </div>
      </div>
      <div class="ms-list">${ms || '<div class="hint">暂无里程碑节点</div>'}</div>
    </div>`;
  }).join("");
}

/* ============ 渲染：临近看板 ============ */
function renderUpcoming() {
  const today = todayStr();
  let items = [];
  contracts.forEach(c => (c.milestones||[]).forEach(m => {
    if (m.done) return;
    const left = daysBetween(today, m.dueDate);
    const stt = statusOf(m, today);
    items.push({ c, m, left, stt });
  }));
  items.sort((a,b) => a.left - b.left);
  const kb = $("#kanban");
  if (!items.length) { kb.innerHTML = `<div class="empty">没有待办节点 🎉 所有里程碑都已完成或未设置。</div>`; return; }
  kb.innerHTML = items.map(it => {
    const cls = it.stt === "overdue" ? "overdue" : it.stt === "due" ? "due" : "up";
    const countTxt = it.left < 0 ? Math.abs(it.left) : it.left;
    const unit = it.left < 0 ? "天前到期" : "天剩";
    return `<div class="kcard ${cls}">
      <div class="kcontract">${esc(it.c.name)}</div>
      <div class="ktitle">${esc(it.m.title)}</div>
      <div class="kcount">${countTxt}<span class="kunit"> ${unit}</span></div>
      <div class="kdate">到期日：${fmtDate(it.m.dueDate)}</div>
      <div class="kremind">提前 ${esc(it.m.remindDays||0)} 天提醒 · ${STATUS_LABEL[it.stt]}</div>
      <div style="margin-top:10px"><button class="btn sm" data-done="${it.c.id}|${it.m.id}">标记完成</button></div>
    </div>`;
  }).join("");
}

/* ============ 渲染：时间轴 ============ */
function renderTimeline() {
  const today = todayStr();
  const allDates = [];
  contracts.forEach(c => {
    if (c.uploadDate) allDates.push(c.uploadDate);
    (c.milestones||[]).forEach(m => { if (m.dueDate) allDates.push(m.dueDate); });
  });
  const wrap = $("#timeline");
  if (!allDates.length) { wrap.innerHTML = `<div class="empty">暂无数据，添加合同与里程碑后此处显示时间轴。</div>`; return; }

  let min = allDates.slice().sort()[0];
  let max = allDates.slice().sort().reverse()[0];
  // pad range
  min = new Date(Date.parse(min) - 20*86400000).toISOString().slice(0,10);
  max = new Date(Date.parse(max) + 20*86400000).toISOString().slice(0,10);
  const span = Math.max(1, daysBetween(min, max));
  const xOf = (d) => ((daysBetween(min, d) / span) * 100);

  // month ticks
  const ticks = [];
  let cur = new Date(min + "T00:00:00");
  while (cur.toISOString().slice(0,10) <= max) {
    if (cur.getDate() === 1 || ticks.length === 0) {
      ticks.push({ d: cur.toISOString().slice(0,10), x: xOf(cur.toISOString().slice(0,10)), label: `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}` });
    }
    cur.setMonth(cur.getMonth()+1);
  }

  const rows = contracts.map(c => {
    const uploadX = c.uploadDate ? xOf(c.uploadDate) : null;
    const ms = (c.milestones||[]).map(m => {
      const stt = statusOf(m, today);
      const x = m.dueDate ? xOf(m.dueDate) : 0;
      return `<div title="${esc(m.title)}（${fmtDate(m.dueDate)}）" style="position:absolute;left:${x}%;top:7px;transform:translateX(-50%);
        width:14px;height:14px;background:${STATUS_COLOR[stt]};transform:translateX(-50%) rotate(45deg);border:2px solid var(--bg-card);cursor:pointer"></div>`;
    }).join("");
    const uploadDot = uploadX != null ? `<div title="上传日 ${fmtDate(c.uploadDate)}" style="position:absolute;left:${uploadX}%;top:9px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--text-faint);border:2px solid var(--bg-card)"></div>` : "";
    return `<div class="tl-row">
      <div class="tl-label" title="${esc(c.name)}">${esc(c.name)}</div>
      <div class="tl-track" style="background:linear-gradient(90deg,transparent,var(--border-soft) 1px) repeat-x;background-size:${100/ticks.length}% 100%">
        ${uploadDot}${ms}
      </div>
    </div>`;
  }).join("");

  wrap.innerHTML = `<div style="position:relative;min-width:720px">
    <div style="display:flex;margin-left:180px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px">
      ${ticks.map(t=>`<div style="flex:1;font-size:11px;color:var(--text-faint)">${t.label}</div>`).join("")}
    </div>
    ${rows}
    <div style="display:flex;align-items:center;gap:16px;margin-top:14px;font-size:12px;color:var(--text-dim)">
      <span>● 上传日</span>
      <span style="color:var(--red)">◆ 已逾期</span>
      <span style="color:var(--orange)">◆ 即将到期</span>
      <span style="color:var(--blue)">◆ 未到期</span>
      <span style="color:var(--green)">◆ 已完成</span>
    </div>
  </div>`;
}

/* ============ 渲染：统计图表（手写 SVG） ============ */
function donutSVG(data, size = 170) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total === 0) return `<svg width="${size}" height="${size}"><text x="${size/2}" y="${size/2}" fill="var(--text-faint)" font-size="13" text-anchor="middle" dominant-baseline="middle">无数据</text></svg>`;
  const r = size/2 - 16, cx = size/2, cy = size/2, C = 2*Math.PI*r;
  let off = 0;
  const segs = data.map(d => {
    const len = (d.value/total)*C;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off += len; return seg;
  }).join("");
  return `<svg width="${size}" height="${size}">${segs}
    <text x="${cx}" y="${cy-6}" fill="var(--text)" font-size="22" font-weight="700" text-anchor="middle">${total}</text>
    <text x="${cx}" y="${cy+14}" fill="var(--text-dim)" font-size="11" text-anchor="middle">总计</text></svg>`;
}
function barSVG(data, w = 300, h = 180) {
  if (!data.length || data.every(d=>!d.value)) return `<svg width="${w}" height="${h}"><text x="${w/2}" y="${h/2}" fill="var(--text-faint)" font-size="13" text-anchor="middle">无数据</text></svg>`;
  const max = Math.max(...data.map(d=>d.value), 1);
  const padL = 10, padB = 28, padT = 10;
  const bw = (w - padL*2) / data.length;
  const bars = data.map((d,i) => {
    const bh = (d.value/max) * (h - padB - padT);
    const x = padL + i*bw + bw*0.15;
    const y = h - padB - bh;
    const label = d.label.length > 6 ? d.label.slice(0,6)+"…" : d.label;
    return `<rect x="${x}" y="${y}" width="${bw*0.7}" height="${bh}" rx="4" fill="${d.color||'var(--accent)'}"/>
      <text x="${x+bw*0.35}" y="${y-4}" fill="var(--text)" font-size="11" text-anchor="middle">${d.value}</text>
      <text x="${x+bw*0.35}" y="${h-10}" fill="var(--text-dim)" font-size="10" text-anchor="middle">${esc(label)}</text>`;
  }).join("");
  return `<svg width="${w}" height="${h}">${bars}</svg>`;
}

/* ============ 提醒引擎 ============ */
function checkReminders() {
  const today = todayStr();
  const due = [];
  contracts.forEach(c => (c.milestones||[]).forEach(m => {
    if (m.done) return;
    const left = daysBetween(today, m.dueDate);
    const remindDays = m.remindDays || 0;
    if (left <= remindDays && left >= -30) {
      const last = m.lastRemindedAt ? m.lastRemindedAt.slice(0,10) : null;
      if (last !== today) due.push({ c, m, left });
    }
  }));
  if (due.length) {
    $("#reminderCount").textContent = due.length;
    $("#reminderItems").textContent = due.slice(0,3).map(d => `${d.c.name} · ${d.m.title}（${d.left<0?`逾期${Math.abs(d.left)}天`:`剩${d.left}天`}）`).join("；") + (due.length>3?` 等 ${due.length} 项`:"");
    $("#reminderBanner").classList.add("show");
    // desktop notification (once per day per milestone)
    if (Notification && Notification.permission === "granted") {
      due.forEach(d => {
        const leftTxt = d.left < 0 ? `已逾期 ${Math.abs(d.left)} 天` : `还剩 ${d.left} 天`;
        try { new Notification("合同里程碑提醒", { body: `${d.c.name} · ${d.m.title}\n${leftTxt}（到期 ${d.m.dueDate}）` }); } catch(e){}
        d.m.lastRemindedAt = new Date().toISOString();
      });
      // persist lastRemindedAt
      due.forEach(d => {
        const c = contracts.find(x=>x.id===d.c.id);
        const mm = c && c.milestones.find(x=>x.id===d.m.id);
        if (mm) mm.lastRemindedAt = d.m.lastRemindedAt;
        if (c) putContract(c).catch(()=>{});
      });
    }
  } else {
    $("#reminderBanner").classList.remove("show");
  }
}

function requestNotifPerm() {
  if (!("Notification" in window)) { toast("当前浏览器不支持桌面通知"); return; }
  Notification.requestPermission().then(p => {
    if (p === "granted") { toast("✅ 桌面提醒已启用"); checkReminders(); }
    else toast("提醒权限被拒绝，仍会在页面内显示横幅");
  });
}

function collectMs() {
  const rows = [...document.querySelectorAll("#msContainer .ms-edit")];
  return rows.map(r => {
    const get = (k) => r.querySelector(`[data-k="${k}"]`).value.trim();
    return {
      id: r.dataset.mid || uid(),
      title: get("title"),
      dueDate: get("dueDate"),
      remindDays: get("remindDays") === "" ? 0 : parseInt(get("remindDays"),10),
      done: r.dataset.done === "1",
    };
  });
}

async function saveContract() {
  const name = $("#f_name").value.trim();
  const uploadDate = $("#f_uploadDate").value;
  if (!name) { toast("请填写合同名称"); return; }
  if (!uploadDate) { toast("请填写上传时间"); return; }
  const id = $("#f_id").value || uid();
  let existing = contracts.find(c => c.id === id);
  const milestones = collectMs().filter(m => m.title && m.dueDate);

  // preserve done & lastRemindedAt from existing
  if (existing) {
    milestones.forEach(m => {
      const old = (existing.milestones||[]).find(o => o.id === m.id);
      if (old) { m.done = old.done; m.lastRemindedAt = old.lastRemindedAt; }
    });
  }

  // file handling
  let fileObj = existing ? existing.file : null;
  const fileInput = $("#f_file");
  if (fileInput.files && fileInput.files[0]) {
    const f = fileInput.files[0];
    fileObj = { name: f.name, type: f.type, size: f.size, blob: f };
  }

  const contract = {
    id,
    name,
    category: $("#f_category").value.trim(),
    party: $("#f_party").value.trim(),
    amount: $("#f_amount").value === "" ? null : Number($("#f_amount").value),
    uploadDate,
    file: fileObj,
    milestones,
    updatedAt: new Date().toISOString(),
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
  };
  await putContract(contract);
  contracts = await getAllContracts();
  closeModal();
  renderAll();
  checkReminders();
  toast(existing ? "已更新合同" : "已新增合同");
}

function parseImportFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
        resolve(rows);
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}

function guessMapping(headers) {
  const norm = (s) => String(s||"").toLowerCase().replace(/\s/g,"");
  const rules = {

    party:     [/对方/, /相对/, /甲方/, /乙方/, /party/, /相对方/],
    amount:    [/金额/, /价/, /费用/, /amount/, /price/, /cost/],
    uploadDate:[/上传时间/, /上传日期/, /日期/, /时间/, /uploaddate/, /date/],
    ms1title:  [/节点1\D*名称/, /里程碑1/, /节点一/, /第一个.*节点/, /节点1/, /里程碑/],
    ms1due:    [/节点1.*到期/, /到期1/, /到期日/, /节点1.*日期/, /due1/],
    ms1remind: [/节点1.*提前/, /提前1/, /提前天/, /remind1/],
    ms2title:  [/节点2\D*名称/, /里程碑2/, /节点二/, /节点2/],
    ms2due:    [/节点2.*到期/, /到期2/, /节点2.*日期/, /due2/],
    ms2remind: [/节点2.*提前/, /提前2/, /remind2/],
  };
  const map = {};
  IMPORT_FIELDS.forEach(f => {
    const rs = rules[f.key] || [];
    const found = headers.findIndex(h => rs.some(r => r.test(norm(h))));
    map[f.key] = found >= 0 ? headers[found] : "";
  });
  return map;
}

function renderMapping() {
  const map = guessMapping(importHeaders);
  $("#importMapping").innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">` + IMPORT_FIELDS.map(f => {
    const opts = ['<option value="">— 忽略 —</option>']
      .concat(importHeaders.map(h => `<option value="${esc(h)}" ${map[f.key]===h?"selected":""}>${esc(h)}</option>`)).join("");
    return `<div><div class="hint" style="margin-bottom:4px">${esc(f.label)}</div>
      <select data-map="${f.key}">${opts}</select></div>`;
  }).join("") + `</div>`;
}

function buildImportRows() {
  const selects = [...document.querySelectorAll("#importMapping select")];
  const colOf = {};
  selects.forEach(s => { colOf[s.dataset.map] = s.value; });
  const getVal = (row, key) => {
    const col = colOf[key];
    if (!col) return "";
    let v = row[col];
    return v == null ? "" : String(v).trim();
  };
  const rows = importData.map(row => {
    const name = getVal(row, "name");
    if (!name) return null;
    const catRaw = getVal(row, "category");
    const dflt = $("#importDefaultCat") ? $("#importDefaultCat").value : "其它";
    const cat = CATEGORIES.includes(catRaw) ? catRaw : (catRaw ? normalizeCat(catRaw) : dflt);
    const amtRaw = getVal(row, "amount");
    const amount = amtRaw === "" ? null : Number(String(amtRaw).replace(/[, ¥￥]/g, ""));
    const milestones = [];
    for (const grp of [{t:"ms1title",d:"ms1due",r:"ms1remind"},{t:"ms2title",d:"ms2due",r:"ms2remind"}]) {
      const t = getVal(row, grp.t), d = getVal(row, grp.d);
      if (t && d) milestones.push({ id: uid(), title: t, dueDate: toISODate(d), remindDays: getVal(row, grp.r) === "" ? 7 : parseInt(getVal(row, grp.r),10) || 0, done: false });
    }
    return {
      id: uid(),
      name,
      category: cat,
      party: getVal(row, "party"),
      amount: isNaN(amount) ? null : amount,
      uploadDate: toISODate(getVal(row, "uploadDate")) || todayStr(),
      file: null,
      milestones,
      updatedAt: new Date().toISOString(),
      createdAt: new Date().toISOString(),
      _imported: true,
    };
  }).filter(Boolean);
  return rows;
}

// 把多种日期表示转为 YYYY-MM-DD（手工拆分，避免时区 off-by-one）
function pad2(n) { return String(n).padStart(2, "0"); }
function toISODate(s) {
  if (!s) return "";
  s = String(s).trim();
  if (/^\d{4}[-/年]\d{1,2}[-/月]\d{1,2}/.test(s)) {
    const m = s.match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
    if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  }
  // Excel 序列号（纯数字 20000~60000）
  if (/^\d{5}$/.test(s)) {
    const d = new Date((Number(s) - 25569) * 86400000);
    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
  }
  // 任意分隔符的 y m d / m d y
  const parts = s.split(/[-/.]/).map(p=>p.trim()).filter(p=>/^\d+$/.test(p));
  if (parts.length >= 3) {
    let [a,b,c] = parts;
    if (a.length === 4) return `${a}-${pad2(b)}-${pad2(c)}`;          // y/m/d
    if (c.length === 4) return `${c}-${pad2(a)}-${pad2(b)}`;          // m/d/y
    if (a.length === 2) return `20${a}-${pad2(b)}-${pad2(c)}`;        // yy/m/d
  }
  // 兜底：用 Date 解析后取本地年月日（避免 toISOString 时区漂移）
  const t = Date.parse(s.replace(/\./g,"-").replace(/\//g,"-"));
  if (!isNaN(t)) { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  return "";
}

function renderImportPreview(rows) {
  const previewCols = ["name","category","party","amount","uploadDate","milestones"];
  const head = `<tr>${previewCols.map(c=>`<th>${esc({name:"合同名称",category:"类别",party:"对方",amount:"金额",uploadDate:"上传时间",milestones:"里程碑数"}[c])}</th>`).join("")}</tr>`;
  const body = rows.slice(0,6).map(r=>`<tr>
    <td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${esc(r.party||"—")}</td>
    <td>${r.amount?fmtMoney(r.amount):"—"}</td><td>${esc(r.uploadDate)}</td>
    <td>${r.milestones.length}</td></tr>`).join("");
  $("#importPreview").innerHTML = rows.length ? `<table style="width:100%;font-size:12px"><thead>${head}</thead><tbody>${body}</tbody></table>` : '<div class="empty">没有可导入的行（需至少含「合同名称」）</div>';
}

async function confirmImport() {
  const rows = buildImportRows();
  if (!rows.length) { toast("没有可导入的数据行"); return; }
  for (const r of rows) { await putContract(r); }
  contracts = await getAllContracts();
  renderAll();
  closeImport();
  toast(`✅ 成功导入 ${rows.length} 条记录`);
}

/* ============ 事件绑定 ============ */
function bindEvents() {
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    activeView = t.dataset.view;
    $("#view-"+activeView).classList.add("active");
    if (activeView === "timeline") renderTimeline();
    if (activeView === "stats") renderStats_charts();
    if (activeView === "upcoming") renderUpcoming();
  }));

  $("#btnAdd").addEventListener("click", () => openModal(null));
  $("#btnCancel").addEventListener("click", closeModal);
  $("#btnSave").addEventListener("click", saveContract);
  $("#btnAddMs").addEventListener("click", () => {
    const cont = $("#msContainer");
    const i = cont.children.length;
    const div = document.createElement("div");
    div.innerHTML = msRowHTML({}, i);
    cont.appendChild(div.firstElementChild);
  });
  $("#modalMask").addEventListener("click", (e) => { if (e.target.id === "modalMask") closeModal(); });

  $("#btnPerm").addEventListener("click", requestNotifPerm);
  $("#btnImport").addEventListener("click", openImport);
  $("#importCancel").addEventListener("click", closeImport);
  $("#importMask").addEventListener("click", (e) => { if (e.target.id === "importMask") closeImport(); });
  $("#importFile").addEventListener("change", async () => {
    const f = $("#importFile").files && $("#importFile").files[0];
    if (!f) return;
    if (typeof XLSX === "undefined") { toast("解析库未加载，请刷新页面"); return; }
    try {
      importData = await parseImportFile(f);
      if (!importData.length) { toast("文件为空或无数据"); return; }
      importHeaders = Object.keys(importData[0]);
      $("#importStep2").style.display = "";
      $("#importNext").style.display = "";
      renderMapping();
      $("#importTitle").textContent = `导入 Excel / CSV（共 ${importData.length} 行）`;
    } catch (err) {
      console.error(err);
      toast("解析失败：" + err.message);
    }
  });
  $("#importNext").addEventListener("click", () => {
    const rows = buildImportRows();
    if (!rows.length) { toast("没有可导入的行，请检查「合同名称」列映射"); return; }
    renderImportPreview(rows);
    $("#importConfirm").style.display = "";
    $("#importNext").style.display = "none";
  });
  $("#importConfirm").addEventListener("click", confirmImport);
  $("#reminderClose").addEventListener("click", () => $("#reminderBanner").classList.remove("show"));
  $("#reminderGoto").addEventListener("click", () => { document.querySelector('.tab[data-view="upcoming"]').click(); });

  $("#searchInput").addEventListener("input", renderContracts);
  $("#filterCat").addEventListener("change", renderContracts);
  $("#filterStatus").addEventListener("change", renderContracts);

  // delegated clicks
  document.body.addEventListener("click", async (e) => {
    const t = e.target;
    if (t.dataset.edit) {
      const c = contracts.find(x=>x.id===t.dataset.edit);
      openModal(c); return;
    }
    if (t.dataset.del) {
      if (confirm("确定删除该合同？（含附件）")) {
        await deleteContract(t.dataset.del);
        contracts = await getAllContracts();
        renderAll(); toast("已删除合同");
      }
      return;
    }
    if (t.dataset.delms) {
      const [cid, mid] = t.dataset.delms.split("|");
      const c = contracts.find(x=>x.id===cid);
      c.milestones = c.milestones.filter(m=>m.id!==mid);
      await putContract(c); contracts = await getAllContracts();
      renderAll(); checkReminders(); return;
    }
    if (t.dataset.done) {
      const [cid, mid] = t.dataset.done.split("|");
      const c = contracts.find(x=>x.id===cid);
      const m = c && c.milestones.find(x=>x.id===mid);
      if (m) { m.done = true; await putContract(c); contracts = await getAllContracts(); renderAll(); checkReminders(); }
      return;
    }
    if (t.dataset.dl) {
      const c = contracts.find(x=>x.id===t.dataset.dl);
      if (c && c.file && c.file.blob) {
        const url = URL.createObjectURL(c.file.blob);
        const a = document.createElement("a");
        a.href = url; a.download = c.file.name; a.click();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
      }
      return;
    }
    if (t.dataset.rmms) {
      const idx = t.dataset.rmms;
      const row = document.querySelector(`#msContainer .ms-edit[data-idx="${idx}"]`);
      if (row) row.remove();
      return;
    }
  });

  // keep ms row ids stable
  $("#msContainer").addEventListener("input", () => {
    [...document.querySelectorAll("#msContainer .ms-edit")].forEach((r,i)=>r.dataset.idx=i);
  });
}

/* ============ 初始化 ============ */
function renderAll() {
  renderStats();
  renderContracts();
  if (activeView === "upcoming") renderUpcoming();
  if (activeView === "timeline") renderTimeline();
  if (activeView === "stats") renderStats_charts();
}

(async function init() {
  try {
    await openDB();
    contracts = await getAllContracts();
    bindEvents();
    renderAll();
    checkReminders();
    // periodic check every 5 min
    setInterval(checkReminders, 5*60*1000);
    if ("Notification" in window && Notification.permission === "granted") {
      // already granted
    }
  } catch (err) {
    console.error(err);
    alert("初始化失败：" + err.message);
  }
})();
</script>
