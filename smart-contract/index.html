<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能合同管理系统（标准版能力补齐）</title>
<style>
  :root{
    --bg:#18191c; --panel:#222327; --panel2:#2a2c31; --line:#373a40;
    --text:#e8e9ec; --sub:#9a9da3; --brand:#3d7eff; --brand-d:#2b5fd0;
    --danger:#f06064; --warn:#f2994a; --ok:#3bb273; --purple:#9a6cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;}
  .app{display:flex; min-height:100vh;}
  /* Sidebar */
  .sidebar{width:210px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:16px 10px; flex-shrink:0;}
  .logo{display:flex; align-items:center; gap:10px; padding:4px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:10px;}
  .logo .ic{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;}
  .logo .t{font-weight:700;font-size:15px;}
  .logo .s{font-size:11px;color:var(--sub);}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--sub);padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:13.5px;margin-bottom:2px;transition:.15s;}
  .nav-btn:hover{background:var(--panel2);color:var(--text);}
  .nav-btn.active{background:var(--brand);color:#fff;}
  .nav-btn .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;
    padding:1px 7px;border-radius:10px;}
  .nav-sep{height:1px;background:var(--line);margin:10px 6px;}
  .side-foot{margin-top:auto;font-size:11px;color:var(--sub);padding:8px;line-height:1.6;}
  .mode-pill{display:inline-block;background:rgba(61,126,255,.15);color:var(--brand);
    border:1px solid var(--brand);padding:2px 8px;border-radius:10px;font-size:11px;}
  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 20px;gap:12px;background:var(--panel);}
  .topbar h1{font-size:16px;margin:0;font-weight:600;}
  .topbar .crumb{color:var(--sub);font-size:13px;}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .content{padding:20px;overflow:auto;flex:1;}
  .section{display:none;}
  .section.active{display:block;}
  /* Cards / grid */
  .grid{display:grid;gap:14px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .stat .num{font-size:26px;font-weight:700;}
  .stat .lbl{color:var(--sub);font-size:12.5px;margin-top:2px;}
  .stat .sub{font-size:12px;margin-top:8px;}
  .card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;}
  .card h3 .tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--sub);}
  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--sub);font-weight:500;background:var(--panel2);position:sticky;top:0;}
  tbody tr:hover{background:var(--panel2);}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;}
  .p-ok{background:rgba(59,178,115,.15);color:var(--ok);}
  .p-warn{background:rgba(242,153,74,.15);color:var(--warn);}
  .p-danger{background:rgba(240,96,100,.15);color:var(--danger);}
  .p-info{background:rgba(61,126,255,.15);color:var(--brand);}
  .p-purple{background:rgba(154,108,255,.15);color:var(--purple);}
  /* Filters */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .inp,.sel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 10px;font-size:13px;outline:none;}
  .inp:focus,.sel:focus{border-color:var(--brand);}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;}
  .btn:hover{border-color:var(--brand);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-d);}
  .btn.sm{padding:4px 10px;font-size:12px;}
  /* Modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:min(880px,100%);max-height:86vh;overflow:auto;}
  .modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
  .modal-head h2{margin:0;font-size:16px;}
  .modal-head .x{margin-left:auto;cursor:pointer;color:var(--sub);font-size:20px;line-height:1;}
  .modal-body{padding:20px;}
  /* Diff */
  .diff-row{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .diff-row .dh{padding:8px 12px;background:var(--panel2);font-weight:600;font-size:13px;
    display:flex;align-items:center;gap:8px;}
  .diff-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  .diff-cols>div{padding:10px 12px;font-size:12.5px;}
  .diff-cols .std{background:rgba(59,178,115,.05);border-right:1px solid var(--line);}
  .diff-cols .act{background:rgba(242,153,74,.05);}
  .diff-cols .lab{color:var(--sub);font-size:11px;margin-bottom:3px;}
  .dev-tag{margin-left:auto;}
  /* Misc */
  .muted{color:var(--sub);}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .kv{display:flex;flex-direction:column;gap:2px;}
  .kv .k{color:var(--sub);font-size:12px;}
  .kv .v{font-size:14px;}
  .kv-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
  .kv-row .kv{min-width:120px;}
  .file-list{display:flex;gap:8px;flex-wrap:wrap;}
  .file-chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--brand);text-decoration:none;margin:3px 6px 3px 0;}
  .file-chip:hover{border-color:var(--brand);}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;}
  .bar>i{display:block;height:100%;}
  .note{font-size:12.5px;color:var(--sub);margin-top:6px;}
  .empty{padding:40px;text-align:center;color:var(--sub);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--brand);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:.25s;}
  .toast.show{opacity:1;}
  .progress{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px;}
  .progress>i{display:block;height:100%;background:var(--brand);transition:width .3s;}
  ul.flat{margin:0;padding-left:18px;}
  ul.flat li{margin:3px 0;}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;cursor:pointer;}
  .chip.on{border-color:var(--brand);color:var(--brand);}
  @media(max-width:900px){.g4,.g3,.g2{grid-template-columns:1fr 1fr;}.sidebar{width:170px;}}
  /* 访问口令门：纯前端遮挡，不构成真实访问控制 */
  .gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .gate-box{width:min(360px,88vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;text-align:center;}
  .gate-box h2{margin:0;font-size:17px;}
  .gate-box input{width:100%;margin:16px 0 12px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;}
  .gate-box input:focus{outline:none;border-color:var(--brand);}
  .gate-err{min-height:18px;margin:10px 0 0;font-size:12px;color:var(--danger);}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <h2>智能合同台账</h2>
    <div class="muted">请输入访问口令后进入</div>
    <input type="password" id="gatePwd" placeholder="访问口令" autofocus>
    <button class="btn primary" type="submit">进入</button>
    <p class="gate-err" id="gateErr"></p>
  </form>
</div>
<div class="app">

    </div>

    <button class="nav-btn" data-tab="contracts">📁 合同台账</button>
    <button class="nav-btn" data-tab="due">⏰ 到期提醒<span class="badge" id="dueBadge">0</span></button>
    <button class="nav-btn" data-tab="risk">🛡️ 智能风控</button>
    <button class="nav-btn" data-tab="accounting">💰 账款发票</button>
    <button class="nav-btn" data-tab="counterparty">🏢 相对方管理</button>
    <button class="nav-btn" data-tab="compare">🔍 审批/归档比对</button>
    <button class="nav-btn" data-tab="template">📐 模板与编号</button>
    <button class="nav-btn" data-tab="batch">🗂️ 批量操作</button>
    <button class="nav-btn" data-tab="borrow">📤 借阅归还</button>
    <div class="nav-sep"></div>
    <button class="nav-btn" data-tab="about">ℹ️ 关于本系统</button>
    <div class="side-foot">
      <span class="mode-pill" id="sideModeTitle">本地演示模式</span><br/>
      <span id="sideModeSub">数据内置 · 规则驱动<br/>无需联网 / 模型 / 密钥</span>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">概览看板</h1>
      <span class="crumb" id="pageCrumb">智能合同管理系统</span>
      <div class="right">
        <span class="mode-pill" id="modePill">演示数据</span>
        <select id="srcSel" class="sel" onchange="onSourceChange()" title="数据来源">
          <option value="demo">演示数据</option>
          <option value="live">钉钉实时</option>
        </select>
        <select id="orgSel" class="sel" onchange="onOrgChange()" title="钉钉组织（dws 已授权账号）" style="display:none"></select>
        <input id="bkUrl" class="inp" placeholder="后端地址" value="http://localhost:8787" style="width:165px" />
        <button id="connBtn" class="btn primary" onclick="connectDingtalk()">连接</button>
      </div>
    </div>
    <div class="content" id="content">
      <div id="liveDiag" style="display:none;margin:12px 0;padding:12px 14px;border:1px solid #f0a020;border-radius:8px;background:#fff8ec;color:#8a5300;font-size:13px;line-height:1.7"></div>

      <!-- DASHBOARD -->
      <section class="section active" id="sec-dashboard"></section>

      <!-- CONTRACTS -->
      <section class="section" id="sec-contracts"></section>

      <!-- DUE -->
      <section class="section" id="sec-due"></section>

      <!-- RISK -->
      <section class="section" id="sec-risk"></section>

      <!-- ACCOUNTING -->
      <section class="section" id="sec-accounting"></section>

      <!-- COUNTERPARTY -->
      <section class="section" id="sec-counterparty"></section>

      <!-- COMPARE -->
      <section class="section" id="sec-compare"></section>

      <!-- TEMPLATE -->
      <section class="section" id="sec-template"></section>

      <!-- BATCH -->
      <section class="section" id="sec-batch"></section>

      <!-- BORROW -->
      <section class="section" id="sec-borrow"></section>

      <!-- ABOUT -->
      <section class="section" id="sec-about"></section>

    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">合同详情</h2><span class="x" onclick="closeModal()">✕</span></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

// 所有后端请求统一带上当前组织，漏带就会读回 dws 默认组织的数据
function api(path, params){
  const q=new URLSearchParams(params||{});
  if(CUR_ORG) q.set('org', CUR_ORG);
  const s=q.toString();
  return BACKEND_URL+path+(s ? (path.includes('?')?'&':'?')+s : '');
}
function setOrgSelUI(){
  const sel=$('#orgSel'); if(!sel) return;
  if(ORGS.length<2){ sel.style.display='none'; sel.innerHTML=''; return; }
  sel.innerHTML=ORGS.map(o=>`<option value="${esc(o.profile)}">${esc(o.corpName||o.corpId)}${o.isCurrent?'（dws 当前）':''}</option>`).join('');
  sel.value=CUR_ORG; sel.style.display='';
}
// 拉取新组织失败时，把选择器拨回页面上真实展示的那份数据所属的组织

  if(!LOADED_ORG) return;
  CUR_ORG=LOADED_ORG; CUR_ORG_NAME=LOADED_ORG_NAME;
  setOrgSelUI();
  $('#modePill').textContent='钉钉实时'+(CUR_ORG_NAME?' · '+CUR_ORG_NAME:'');
}
// 组织清单来自 dws profile list：多登录一个组织，这里就多一个可选项
async function loadOrgs(url){
  try{
    const r=await fetch(url+'/api/dingtalk/orgs');
    const j=await r.json().catch(()=>({}));
    ORGS = r.ok && Array.isArray(j.orgs) ? j.orgs : [];
  }catch(e){ ORGS=[]; return; }
  if(!ORGS.length) return;
  let saved=''; try{ saved=localStorage.getItem(LS_ORG)||''; }catch(e){}
  // 上次选的组织可能已退出登录 → 回退到 dws 当前组织，不能凭空指定一个读不到的组织
  const pick = ORGS.find(o=>o.profile===saved) || ORGS.find(o=>o.isCurrent) || ORGS[0];
  CUR_ORG=pick.profile; CUR_ORG_NAME=pick.corpName||'';
  setOrgSelUI();
}
function onOrgChange(){
  const sel=$('#orgSel'); if(!sel) return;
  const v=sel.value;
  if(v===CUR_ORG) return;
  CUR_ORG=v; CUR_ORG_NAME=(ORGS.find(o=>o.profile===v)||{}).corpName||'';
  try{ localStorage.setItem(LS_ORG, v); }catch(e){}
  if(DATA_SOURCE==='live') connectDingtalk(); // 换组织 = 重取该组织的台账
}

async function connectDingtalk(auto){
  const url=($('#bkUrl').value||'').trim().replace(/\/$/,'');
  if(!url){ if(!auto) toast('请填写后端地址'); return; }
  BACKEND_URL=url;
  $('#connBtn').textContent='连接中…'; $('#connBtn').disabled=true;
  // 后端列表缓存过期时全量拉取约需 1 分钟，期间必须明确「数据还没到」，
  // 否则页面停在演示数据上会被误读成「临期/逾期提醒都不见了」
  $('#modePill').textContent='钉钉实时 · 拉取中（首次约 1 分钟）';
  try{
    const st=await fetch(url+'/api/dingtalk/status').then(r=>r.json());
    if(!st.mode || st.mode==='demo'){
      if(auto){ fallbackToDemo('后端未配置钉钉凭证，已切回演示数据'); return; }
      toast('后端未配置钉钉凭证（当前为 demo 模式）');
      $('#modePill').textContent='钉钉(未连)';
      hideLiveDiag();
      setConnBtn('连接', false);
      return;
    }
    if(st.channel==='dws') await loadOrgs(url); // 先确定要读哪个组织，再取该组织的台账
    if(CUR_ORG_NAME) $('#modePill').textContent='钉钉实时 · '+CUR_ORG_NAME+' · 拉取中（首次约 1 分钟）';
    const data=await fetch(api('/api/dingtalk/bootstrap')).then(r=>r.json());
    if(data && !Array.isArray(data.contracts)){
      // 后端明确报错（如所选组织未登录/无权限）：保留当前数据，不能当成「该组织 0 份合同」
      restoreLoadedOrg();
      toast('读取失败：'+(data.message||'后端返回异常'));
      showLiveDiag(JSON.stringify(data, null, 2), st.channel);
      setConnBtn('刷新', false);
      return;
    }
    CONTRACTS = data.contracts||[];
    PARTIES = data.parties||[];
    ACCOUNTING = data.accounting||[];
    BORROWS = data.borrows||[];
    OWN_COMPS = Array.isArray(data.ownCompanies)?data.ownCompanies.slice():[];
    CATS = Array.isArray(data.cats)?data.cats.slice():[];
    filterCompany='全部'; filterCat='全部'; cpCompany='全部'; // 换组织/重拉后公司集合不同，沿用旧筛选会筛出空列表
    DATA_SOURCE='live';
    SOURCE_CHANNEL=st.channel||'';
    SOURCE_TOTAL=Number((data.stats||{}).sourceTotal||0);
    if(data.org && data.org.corpName) CUR_ORG_NAME=data.org.corpName;
    LOADED_ORG=CUR_ORG; LOADED_ORG_NAME=CUR_ORG_NAME; // 这份数据确实属于该组织，之后才允许「回退到它」
    $('#modePill').textContent='钉钉实时'+(CUR_ORG_NAME?' · '+CUR_ORG_NAME:'');
    setSideMode('钉钉实时', (st.channel==='dws' ? 'dws 直连智能合同' : '已接入智能合同连接器')
      + (CUR_ORG_NAME ? ' · 组织：'+CUR_ORG_NAME : ''));
    if(CONTRACTS.length===0){
      if(SOURCE_TOTAL===0){
        // 接口正常返回 0 条 = 这个组织的「智能合同」里没有（或没有该账号能看到的）合同，
        // 不是连接故障，不该挂出连接器失败排查清单误导
        hideLiveDiag();
        toast((CUR_ORG_NAME||'该组织')+'：连接正常，但智能合同接口返回 0 份合同 —— 该组织可能尚未在智能合同中登记合同，或当前账号看不到其合同。');
      }else{
        toast('已连接钉钉，但返回 0 份合同');
        showLiveDiag(data.rawResponse, st.channel);
      }
    }else{
      hideLiveDiag();
      toast((CUR_ORG_NAME?CUR_ORG_NAME+'：':'')+(SOURCE_TOTAL>0
        ? '已接入钉钉智能合同 '+CONTRACTS.length+'/'+SOURCE_TOTAL+' 份'+(CONTRACTS.length===SOURCE_TOTAL?'（已全量）':'（差 '+(SOURCE_TOTAL-CONTRACTS.length)+' 份）')
        : '已接入钉钉智能合同，共 '+CONTRACTS.length+' 份合同'));
    }
    setSrcSel('live');
    savePrefs('live');
    setConnBtn('刷新', false);
    renderAll();
    if(st.channel==='dws') pollEnrich(); // 逐合同补全在后台跑，完成后自动刷新出起止日期
  }catch(e){
    // DATA_SOURCE 已在取数成功后置为 live：此时抛出的异常来自渲染/收尾，
    // 不能当成「连接失败」静默回退演示数据，否则页面看起来像没连上钉钉。
    if(DATA_SOURCE==='live'){ restoreLoadedOrg(); console.error('钉钉数据已取到，但渲染出错：',e); toast('数据已加载，但页面渲染出错（见控制台）'); setConnBtn('刷新',false); return; }
    if(auto) fallbackToDemo('自动连接钉钉失败，已切回演示数据');
    else toast('连接失败：'+e.message);
    setConnBtn('连接', false);
  }
}
// 后台补全进度轮询：实时显示进度，完成后静默刷新一次列表
let enrichTimer=null;
function pollEnrich(){
  if(enrichTimer) clearInterval(enrichTimer);
  let ticks=0;
  enrichTimer=setInterval(async()=>{
    ticks++;
    try{
      const es=await fetch(api('/api/dingtalk/enrich-status')).then(r=>r.json());
      ENRICH={running:!!es.running,done:es.done||0,total:es.total||0};
      const orgTag=CUR_ORG_NAME?' · '+CUR_ORG_NAME:'';
      if(es&&es.total&&es.running){ $('#modePill').textContent='钉钉实时'+orgTag+' · 补全中 '+es.done+'/'+es.total; }
      if(es&&es.total&&!es.running){
        clearInterval(enrichTimer); enrichTimer=null;
        const data=await fetch(api('/api/dingtalk/bootstrap')).then(r=>r.json());
        if(Array.isArray(data.contracts)){
          CONTRACTS=data.contracts; PARTIES=data.parties||PARTIES;
          ACCOUNTING=data.accounting||ACCOUNTING; BORROWS=data.borrows||BORROWS;
        }
        $('#modePill').textContent='钉钉实时'+orgTag;
        renderAll();
        const withRange=CONTRACTS.filter(c=>c.start||c.end).length;
        toast('详情补全完成：'+CONTRACTS.length+' 份合同中 '+withRange+' 份含起止日期');
      }
    }catch(e){ /* 忽略轮询异常 */ }

function $(s){return document.querySelector(s);}
function fmtMoney(n){return '¥'+Number(n).toLocaleString('zh-CN');}
// 日期无效（如合同表单未登记到期日）时返回 null，调用方需自行判空，避免出现「NaN 天」
function daysBetween(a,b){const d1=new Date(a),d2=new Date(b);if(isNaN(d1.getTime())||isNaN(d2.getTime()))return null;return Math.round((d2-d1)/86400000);}
// 期限展示：有值显示区间；已取过详情但表单无日期时说明原因，而不是只给一个「—」
function dateRangeHtml(c){
  if(c.start||c.end) return esc(c.start||'—')+' ~ '+esc(c.end||'—');
  if(c._detail) return '<span class="muted">该合同表单未登记生效/终止日期</span>';
  return '<span class="muted">—</span>';
}
// 详情接口回填的相对方可能比拉列表时更权威（例如改成自家子公司简称），
// 按后端同一套规则在前端重算「集团内」标记，不必等 5 分钟列表缓存过期
function refreshPartyOwn(c){
  const norm=s=>String(s||'').replace(/\s+/g,'').replace(/[()（）]/g,'');
  const v=norm(c.party);
  if(!v){ c.partyOwn=false; return; }
  const names=OWN_COMPS.map(norm).filter(Boolean);
  c.partyOwn = names.includes(v) || (v.length>=4 && names.some(n=>n.includes(v)||v.includes(n)));
}
// 相对方展示：区分「表单权威值」与「按合同名推断」，推断值标注提醒用户
// trim=1 时截断（台账表格用），详情弹窗里给全称
function partyHtml(c,trim){
  if(!c.party||c.party==='—') return '<span class="muted">未识别</span>';
  const p=String(c.party);
  let h=trim&&p.length>12?`<span title="${esc(p)}">${esc(p.slice(0,12))}…</span>`:esc(p);
  if(c.partyOwn) h+=' <span class="pill p-info" title="该「相对方」其实是本方盖章主体（集团内互盖章），不计入相对方统计">集团内</span>';
  if(c.partyInferred) h+=' <span class="pill p-warn" title="由合同名称推断，打开详情后会用表单字段自动校正">推断</span>';
  return h;
}
function levelPill(l){

function statusPill(s){
  const map={'履行中':'p-info','已完结':'p-ok','待审批':'p-warn','已逾期':'p-danger','已到期':'p-danger',
    '未生效':'p-warn','待生效':'p-warn','已作废':'p-info','待归档':'p-warn','归档确认中':'p-warn','已归档':'p-ok'};
  return `<span class="pill ${map[s]||'p-info'}">${esc(s)}</span>`;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- 合同风险评分（规则驱动） ---------- */
function contractRisk(c){
  let score=0, items=[];
  // 条款偏离
  (c.clauses||[]).forEach(cl=>{
    if(cl.dev){
      const bad = /连带|无限|无限连带/.test(cl.actual);
      const heavy = /违约金|上限/.test(cl.topic) || /高于标准|偏重/.test(cl.note);
      if(bad){score+=40; items.push({lv:'高',t:`条款【${cl.topic}】含无限连带责任`,d:cl.note});}
      else if(heavy){score+=18; items.push({lv:'中',t:`条款【${cl.topic}】偏离标准且对己方偏重`,d:cl.note});}
      else{score+=8; items.push({lv:'低',t:`条款【${cl.topic}】与标准模板存在偏离`,d:cl.note});}
    }
  });
  // 归档比对不一致
  const mis = (c.archiveCheck||[]).filter(x=>!x.match).length;
  if(mis>0){score+=25; items.push({lv:'高',t:`归档比对发现 ${mis} 处扫描件与定稿不一致`,d:'需核对原件后重新归档。'});}
  // 相对方风险
  const p = PARTIES.find(x=>x.name===c.party);
  if(p && p.level==='高'){score+=30; items.push({lv:'高',t:`相对方【${p.name}】风险等级高`,d:p.reasons.join('；')});}
  else if(p && p.level==='中'){score+=12; items.push({lv:'中',t:`相对方【${p.name}】风险等级中`,d:p.reasons.join('；')});}
  // 到期临近（由外部计算后补充）
  score = Math.min(score,100);
  const lv = score>=60?'高':score>=30?'中':'低';
  return {score,lv,items};
}

/* ============================================================

   ============================================================ */
function renderDue(){
  const all = CONTRACTS.map(c=>({c,left:daysBetween(today,c.end)}))
    .filter(x=>x.left!==null && x.c.status!=='已完结')
    .sort((a,b)=>a.left-b.left);
  const overdue = all.filter(x=>x.left<0);
  const soon = all.filter(x=>x.left>=0 && x.left<=30);
  const mid = all.filter(x=>x.left>30 && x.left<=90);
  $('#dueBadge').textContent = (overdue.length+soon.length);

  function block(title,arr,cls){
    if(!arr.length) return '';
    return `<div class="card"><h3>${title} <span class="tag">${arr.length} 条</span></h3><table>
      <thead><tr><th>合同</th><th>相对方</th><th>到期日</th><th>状态</th><th>负责人</th><th></th></tr></thead><tbody>
      ${arr.map(x=>`<tr>
        <td>${esc(x.c.name)}</td><td>${esc(x.c.party.slice(0,12))}</td>
        <td>${x.c.end}</td>
        <td>${x.left<0?'<span class="pill p-danger">已逾期 '+(-x.left)+'天</span>':'<span class="pill '+cls+'">剩 '+x.left+' 天</span>'}</td>
        <td>${x.c.owner}</td>
        <td><button class="btn sm" onclick="openContract('${x.c.id}')">处理</button></td>
      </tr>`).join('')}
      </tbody></table></div>`;
  }
  // 实时模式下列表接口本身不含起止日期，未补全的合同无法参与到期计算，必须与「真的没有临期」区分开
  const dated = CONTRACTS.filter(c=>c.start||c.end).length;
  const undated = CONTRACTS.length-dated;
  const coverNote = (DATA_SOURCE==='live' && undated>0)
    ? `<div class="note" style="margin-bottom:12px;background:#fff8e6;border-color:#f0d8a0">ℹ️ 合同列表接口不含起止日期，需逐合同调详情补全：已取到到期日 <b>${dated} / ${CONTRACTS.length}</b>${ENRICH.running?'（补全进行中，完成后本页自动刷新）':'（补全已完成）'}；其余 ${undated} 份的合同表单本身未登记期限，因此不参与到期计算。</div>`
    : '';
  $('#sec-due').innerHTML = `
    ${coverNote}
    <div class="note" style="margin-bottom:12px">系统按合同到期日自动计算剩余天数，对逾期与临近到期（≤30天）合同重点提示，弥补标准版缺失的「到期提醒」能力。</div>
    ${overdue.length?block('🔴 已逾期未处理',overdue,'p-danger'):''}
    ${soon.length?block('🟠 30天内到期（紧急）',soon,'p-warn'):''}
    ${mid.length?block('🟡 31–90天到期（关注）',mid,'p-info'):''}
    ${(!overdue.length&&!soon.length&&!mid.length)?'<div class="empty">'+(ENRICH.running?'起止日期补全完成后将自动列出提醒':(undated?'暂无到期提醒（'+undated+' 份合同未登记期限，未参与计算）':'暂无到期提醒'))+'</div>':''}
  `;
}

/* ============================================================
   渲染：相对方管理
   ============================================================ */
let cpCompany='全部', CP_COMPS=[];
function setCpCompany(i){ cpCompany = i<0 ? '全部' : (CP_COMPS[i]||'全部'); renderCounterparty(); }
function renderCounterparty(){
  // 相对方按「用印选择的公司名称」分类：同一相对方可能跟多个子公司都签过，
  // 所以逐公司分别计数，而不是合并成一个总数
  // partyOwn=本方盖章主体（集团内互盖章被填在相对方栏），不算外部相对方
  const byParty=new Map();
  let ownHits=0;
  for(const c of CONTRACTS){
    if(!c.party || c.party==='—') continue;
    if(c.partyOwn){ ownHits++; continue; }
    const comp=c.company||'未识别';
    if(!byParty.has(c.party)) byParty.set(c.party,new Map());
    const m=byParty.get(c.party); m.set(comp,(m.get(comp)||0)+1);
  }
  CP_COMPS=[...new Set([...byParty.values()].flatMap(m=>[...m.keys()]))].sort((a,b)=>{
    if(a==='未识别') return 1; if(b==='未识别') return -1;
    return a.localeCompare(b,'zh');
  });
  if(cpCompany!=='全部' && !CP_COMPS.includes(cpCompany)) cpCompany='全部';
  const ownNames=new Set(CONTRACTS.filter(c=>c.partyOwn).map(c=>c.party));
  let rows=PARTIES.filter(p=>!ownNames.has(p.name));
  for(const c of CONTRACTS){
    if(!c.party||c.party==='—'||c.partyOwn) continue;
    if(!rows.find(p=>p.name===c.party)) rows.push({name:c.party,type:'相对方',code:'—',level:'—',reasons:['（合同台账中出现的相对方，未单独登记）'],contracts:0});
  }
  const cnt=(p)=>{const m=byParty.get(p.name);
    if(cpCompany!=='全部') return m?.get(cpCompany)||0;
    return m ? [...m.values()].reduce((s,v)=>s+v,0) : (p.contracts||0);};
  if(cpCompany!=='全部') rows=rows.filter(p=>(byParty.get(p.name)?.get(cpCompany)||0)>0);
  rows.sort((a,b)=>cnt(b)-cnt(a) || a.name.localeCompare(b.name,'zh'));
  const chips = `
  <div class="toolbar">
    ${CP_COMPS.length>1?`<span class="muted">用印公司：</span><span class="chip ${cpCompany==='全部'?'on':''}" onclick="setCpCompany(-1)">全部</span>${CP_COMPS.map((x,i)=>`<span class="chip ${cpCompany===x?'on':''}" onclick="setCpCompany(${i})" title="${esc(x)}">${esc(x.length>14?x.slice(0,14)+'…':x)}</span>`).join('')}`:''}
    <span style="margin-left:auto" class="muted">${ownHits?`<span title="这些合同的「相对方」栏填的是本方盖章主体（集团内互盖章），不计入相对方">已排除集团内用印 ${ownHits} 份 · </span>`:''}共 ${rows.length} 个相对方</span>
  </div>`;
  html=chips+`
  <div class="card" style="padding:0;overflow:auto">
    <table><thead><tr><th>相对方</th><th>类型</th><th>统一社会信用代码</th><th>风险等级</th><th>关联合同${cpCompany==='全部'?'':'（'+esc(cpCompany)+'）'}</th><th>用印公司</th><th>风险原因</th></tr></thead><tbody>
    ${rows.map(p=>{const m=byParty.get(p.name)||new Map();
      const compCell=[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k.length>12?k.slice(0,12)+'…':k)} ×${v}`).join('<br/>')||'<span class="muted">—</span>';
      return `<tr>
      <td><b>${esc(p.name)}</b></td><td><span class="pill p-info">${p.type}</span></td>
      <td class="muted">${p.code}</td><td>${levelPill(p.level)}</td>
      <td>${cnt(p)}</td>
      <td style="font-size:12px" title="${esc([...m.keys()].join('、'))}">${compCell}</td>
      <td class="muted" style="font-size:12.5px">${p.reasons.map(r=>'· '+esc(r)).join('<br/>')}</td></tr>`;}).join('')}
    </tbody></table>
  </div>`;
  $('#sec-counterparty').innerHTML=html;
}

function batchOp(kind){
  const ids=[...document.querySelectorAll('#sec-batch .chk:checked')].map(c=>c.value);

async function saveClass(id){
  const c=CONTRACTS.find(x=>x.id===id); if(!c) return;
  const catEl=document.getElementById('clsCat'), compEl=document.getElementById('clsComp');
  if(!catEl||!compEl) return;
  const payload={cid:c.cid, cat:catEl.value, company:compEl.value.trim()};
  try{
    const r=await fetch(api('/api/dingtalk/classify'),{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(x=>x.json());
    if(!r || r.ok!==true){ toast('改判失败：'+((r&&r.message)||'后端未返回成功')); return; }
    c.cat=r.cat; c.company=r.company; c.companySrc=r.companySrc;
    c.catSrc = payload.cat ? '人工' : c.catSrc;
    // 新认定的我方盖章主体可能正是别的合同里被当成相对方的那家子公司，整表重算一次
    if(payload.company && !OWN_COMPS.includes(payload.company)) OWN_COMPS.push(payload.company);
    CONTRACTS.forEach(refreshPartyOwn);
    toast('已改判：'+(r.company||'未识别公司')+' · '+(r.cat||'—'));
    renderAll(); renderContractModal(c);
  }catch(e){ toast('改判失败：'+e.message); }
}
async function checkPartyRiskById(id){
  const c=CONTRACTS.find(x=>x.id===id); if(!c)return;
  const box=document.getElementById('partyRiskBox'); if(!box)return;
  if(!c.party||c.party==='—'){ box.innerHTML='<div class="muted">该合同未识别到相对方</div>'; return; }
  if(!BACKEND_URL){ box.innerHTML='<div class="muted">未连接钉钉后端</div>'; return; }
  const caveat = c.partyInferred? '<div class="muted" style="margin-bottom:6px">⚠️ 该相对方系按合同名称推断，若非工商登记全称可能查不到结果。</div>' : '';
  box.innerHTML=caveat+'<div class="muted">查询中…</div>';
  try{
    const [info,risk]=await Promise.all([
      fetch(api('/api/dingtalk/subject-info',{name:c.party})).then(r=>r.json()).catch(()=>null),
      fetch(api('/api/dingtalk/subject-risk',{name:c.party})).then(r=>r.json()).catch(()=>null),
    ]);
    let html='';
    if(info && typeof info==='object' && Object.keys(info).length){
      const keys=['unifiedSocialCreditCode','legalPerson','legalRepresentative','regCapital','registeredCapital','businessStatus','status','establishDate','enterpriseType','regAddress'];
      const rows=keys.filter(k=>info[k]!==undefined&&info[k]!==null&&info[k]!=='').map(k=>`<div class="kv"><div class="k">${k}</div><div class="v">${esc(info[k])}</div></div>`);
      html+= rows.length?`<div class="kv-row">${rows.join('')}</div>`:'<div class="muted">工商接口已返回，但无可展示字段</div>';
    } else { html+='<div class="muted">未获取到工商信息（钉钉智能合同工商库未开通或无该主体记录）</div>'; }
    if(risk && typeof risk==='object'){
      const ok = risk.freeBenefitRestEnough===true;
      html+=`<div class="muted" style="margin-top:8px">风险检测：${ok?'已开通，未返回具体风险项':'本组织未开通工商风险检测服务（钉钉智能合同付费能力）'}</div>`;
    }
    box.innerHTML=caveat+(html||'<div class="muted">无数据</div>');
  }catch(e){ box.innerHTML='<div class="muted">查询失败：'+esc(e.message)+'</div>'; }
}

/* ---------------- 访问口令 ----------------
   只存哈希，口令本身不出现在源码里；但纯前端校验任何人改一下 DOM/脚本就能绕过，
   它挡的是「随手打开就看到台账」，不是真正的访问控制。需要真权限得靠后端鉴权。 */
const GATE_HASH='c0be631e83627cac';
const GATE_LS='sc.gate.v1';
function gateHash(s){
  let h=0xcbf29ce484222325n; const P=0x100000001b3n, M=(1n<<64n)-1n;
  for(const ch of String(s)){ h^=BigInt(ch.codePointAt(0)); h=(h*P)&M; }
  return h.toString(16);
}
(function gateInit(){
  let unlocked=false;
  try{ unlocked=localStorage.getItem(GATE_LS)==='1'; }catch(e){}
  if(unlocked){ const g=$('#gate'); if(g) g.remove(); startApp(); return; }
  const form=$('#gateForm');
  if(!form){ startApp(); return; }
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const pwd=$('#gatePwd');
    if(gateHash(pwd?pwd.value:'')===GATE_HASH){
      const g=$('#gate'); if(g) g.remove();
      try{ localStorage.setItem(GATE_LS,'1'); }catch(err){ /* 隐私模式下每次都要重输 */ }
      startApp();
    }else{
      const err=$('#gateErr'); if(err) err.textContent='口令不正确';
    }
  });
})();
